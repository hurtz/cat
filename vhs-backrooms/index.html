<!doctype html>

<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #screen{position:absolute;display:block;image-rendering:auto;background:#000}
  #hit{position:absolute;inset:0;cursor:none;background:transparent}
  #warn{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#5a5a5a;
    font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;pointer-events:none}

<body>
<canvas id="screen"></canvas>
<div id="hit"></div>
<div id="warn"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ==== 00_core.js ======================================================== */
/* ============================================================================
   CORE — registry, deterministic RNG, shared state, event bus, config.
   Everything else in the build registers into VB. Do not edit outside of
   coordination; module authors only add files under src/.
   ========================================================================== */

const VB = {
  THREE,
  _factories: [],
  mods: {},
  /* Register a module. factory(VB, THREE) -> instance object.
     Optional instance lifecycle: init(), update(dt), lateUpdate(dt), resize(w,h) */
  def(name, factory, order = 50) {
    VB._factories.push({ name, factory, order });
  },
};

/* ---------------------------------------------------------------- config */
VB.cfg = {
  /* 4:3 is non-negotiable — widescreen instantly reads as "modern game" */
  aspect: 4 / 3,
  /* CCD / optics stage resolution (the "camera" before it hits tape) */
  sceneW: 640,
  sceneH: 480,
  /* Simulated tape luma bandwidth. VHS ~240 visible lines, ~333 luma samples
     per active line; chroma is ~1/8 of that. postfx enforces this. */
  tapeW: 640,
  tapeH: 480,
  /* NTSC 29.97 — silky 60fps is the single loudest "this is a game" tell */
  fps: 29.97,
  fov: 62,            // ~ consumer camcorder at wide end
  eyeHeight: 1.62,
  walkSpeed: 2.35,
  runSpeed: 4.05,
  playerRadius: 0.34,
};

/* ------------------------------------------------------------------- rng */
/* mulberry32 — fast, decent, deterministic */
VB.rngFrom = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
/* Stable spatial hash -> uint32. Same cell always yields the same world. */
VB.hash2 = function (x, y, salt = 0) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (salt | 0) * 2147483647;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};
VB.hashf = function (x, y, salt = 0) { return VB.hash2(x, y, salt) / 4294967296; };

/* ----------------------------------------------------------------- state */
/* Written by owning modules, read by everyone. Ranges are contractual. */
VB.S = {
  t: 0,             // elapsed game seconds since boot
  dt: 0,            // frame delta (clamped)
  frame: 0,
  seed: (Math.random() * 0xffffffff) >>> 0,

  /* --- driven by player module --- */
  pos: null,        // THREE.Vector3, set at boot
  yaw: 0, pitch: 0,
  turn: 0,          // 0..1 smoothed normalised angular speed
  move: 0,          // 0..1 normalised translation speed
  running: 0,       // 0..1
  bobPhase: 0,

  /* --- driven by layout --- */
  cell: null,       // {cx,cz} current chunk-cell
  roomPulse: 0,     // 0..1 spikes on room entry, decays. drives tracking tear
  anomaly: 0,       // 0..1 how "wrong" the current space is

  /* --- driven by entity --- */
  prox: 0,          // 0..1 entity proximity influence
  seen: 0,          // 0..1 how directly the entity is in frame
  stalked: 0,       // 0..1 slow-building "being followed"

  /* --- driven by director (in boot) --- */
  dread: 0,         // 0..1 overall tension
  wear: 0,          // 0..1 cumulative tape degradation (monotonic, slow)
  burst: 0,         // 0..1 static burst, event-driven, decays fast
  dropout: 0,       // 0..1 momentary signal loss
};

/* ------------------------------------------------------------------- bus */
VB._subs = Object.create(null);
VB.on = function (evt, fn) {
  (VB._subs[evt] || (VB._subs[evt] = [])).push(fn);
  return () => { const a = VB._subs[evt]; const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); };
};
VB.emit = function (evt, payload) {
  const a = VB._subs[evt];
  if (!a) return;
  for (let i = 0; i < a.length; i++) { try { a[i](payload); } catch (e) { console.error('[bus]', evt, e); } }
};

/* ----------------------------------------------------------------- utils */
VB.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
VB.lerp = (a, b, t) => a + (b - a) * t;
VB.smoothstep = (e0, e1, x) => { const t = VB.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
/* frame-rate independent exponential approach */
VB.approach = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));

/* Value noise, 1D — used all over for flicker / wow / drift */
VB.vnoise1 = function (x, salt = 0) {
  const i = Math.floor(x), f = x - i;
  const a = VB.hashf(i, 0, salt), b = VB.hashf(i + 1, 0, salt);
  const u = f * f * (3 - 2 * f);
  return a + (b - a) * u;
};
/* fBm of the above */
VB.fbm1 = function (x, oct = 4, salt = 0) {
  let s = 0, amp = 0.5, fr = 1;
  for (let i = 0; i < oct; i++) { s += amp * VB.vnoise1(x * fr, salt + i * 17); fr *= 2.03; amp *= 0.5; }
  return s;
};


/* ==== 10_materials.js =================================================== */
/* ============================================================================
   MATERIALS — every surface generated into a <canvas> at boot. No image files.

   The mono-yellow is the whole point, so it can never be flat: vertical
   printing stripes, a chair rail, damp rising from the skirting, scuffs.
   ========================================================================== */
VB.def('materials', function (VB, THREE) {

  function cv(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return { c, g: c.getContext('2d') };
  }
  function tex(canvas, rx, ry) {
    const t = new THREE.CanvasTexture(canvas);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1);
    t.anisotropy = 4;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  /* seeded noise splat helper */
  function grain(g, w, h, n, alpha, size, hue) {
    for (let i = 0; i < n; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      g.fillStyle = hue ? hue(Math.random()) : `rgba(0,0,0,${(Math.random() * alpha).toFixed(3)})`;
      g.fillRect(x, y, Math.random() * size + 0.5, Math.random() * size + 0.5);
    }
  }

  /* ------------------------------------------------------------ wallpaper */
  function makeWall(seed) {
    const R = VB.rngFrom(seed);
    const W = 512, H = 512;
    const { c, g } = cv(W, H);
    /* base — sickly institutional yellow, slightly green in the shadows */
    g.fillStyle = '#c9b96a'; g.fillRect(0, 0, W, H);

    /* vertical print striping, uneven period */
    for (let x = 0; x < W; x += 2) {
      const v = 0.5 + 0.5 * Math.sin(x * 0.42 + Math.sin(x * 0.031) * 2.2);
      const a = 0.030 + v * 0.055;
      g.fillStyle = `rgba(150,132,64,${a.toFixed(3)})`;
      g.fillRect(x, 0, 2, H);
    }
    /* faint horizontal weave of the vinyl */
    for (let y = 0; y < H; y += 3) {
      g.fillStyle = `rgba(255,246,190,${(0.02 + Math.random() * 0.03).toFixed(3)})`;
      g.fillRect(0, y, W, 1);
    }
    /* mottled damp — low frequency blobs */
    for (let i = 0; i < 26; i++) {
      const x = R() * W, y = R() * H, r = 30 + R() * 130;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const dark = R() < 0.5;
      gr.addColorStop(0, dark ? 'rgba(96,84,42,0.20)' : 'rgba(226,214,150,0.16)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    /* damp rising from the floor — bottom of texture is bottom of wall */
    const rise = g.createLinearGradient(0, H, 0, H * 0.52);
    rise.addColorStop(0, 'rgba(74,62,30,0.46)');
    rise.addColorStop(0.45, 'rgba(88,76,38,0.17)');
    rise.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rise; g.fillRect(0, 0, W, H);
    /* a scalloped tide line where the damp stopped */
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, H * (0.70 + 0.055 * Math.sin(x * 0.021 + seed) + 0.03 * Math.sin(x * 0.07)));
    g.lineTo(W, H); g.closePath();
    g.fillStyle = 'rgba(70,58,26,0.15)'; g.fill();

    /* chair rail / batten — the horizontal that makes it read as an office */
    const railY = H * 0.63;
    g.fillStyle = 'rgba(60,50,22,0.30)'; g.fillRect(0, railY - 1, W, 2);
    g.fillStyle = 'rgba(232,222,164,0.30)'; g.fillRect(0, railY + 1, W, 2);

    /* scuffs and knocks along the traffic height */
    for (let i = 0; i < 90; i++) {
      const x = R() * W, y = H * (0.62 + R() * 0.36), len = 4 + R() * 34;
      g.strokeStyle = `rgba(58,48,20,${(0.05 + R() * 0.16).toFixed(3)})`;
      g.lineWidth = 0.6 + R() * 1.5;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len * (R() - 0.2), y + (R() - 0.5) * 3); g.stroke();
    }
    grain(g, W, H, 5200, 0.055, 2.0);
    grain(g, W, H, 1400, 0.05, 1.6, () => `rgba(255,248,205,${(Math.random() * 0.06).toFixed(3)})`);
    return c;
  }

  /* --------------------------------------------------------------- carpet */
  function makeCarpet(seed) {
    const R = VB.rngFrom(seed);
    const W = 512, H = 512;
    const { c, g } = cv(W, H);
    g.fillStyle = '#a8994f'; g.fillRect(0, 0, W, H);
    /* commercial loop pile — short dashes in two directions */
    for (let i = 0; i < 26000; i++) {
      const x = R() * W, y = R() * H;
      const v = R();
      g.strokeStyle = v < 0.5
        ? `rgba(${(96 + R() * 30) | 0},${(86 + R() * 28) | 0},${(38 + R() * 18) | 0},0.55)`
        : `rgba(${(180 + R() * 44) | 0},${(168 + R() * 40) | 0},${(96 + R() * 30) | 0},0.35)`;
      g.lineWidth = 0.9;
      const a = R() < 0.5 ? 0 : Math.PI / 2;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 2.2, y + Math.sin(a) * 2.2); g.stroke();
    }
    /* the stains — this is what sells it */
    for (let i = 0; i < 20; i++) {
      const x = R() * W, y = R() * H, r = 16 + R() * 95;
      const gr = g.createRadialGradient(x, y, r * 0.15, x, y, r);
      gr.addColorStop(0, `rgba(${(58 + R() * 26) | 0},${(46 + R() * 22) | 0},${(20 + R() * 14) | 0},${(0.24 + R() * 0.3).toFixed(2)})`);
      gr.addColorStop(0.72, 'rgba(70,58,26,0.11)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      /* irregular blob rather than a circle */
      g.beginPath();
      for (let a = 0; a <= 6.5; a += 0.35) {
        const rr = r * (0.62 + 0.38 * VB.vnoise1(a * 1.7 + i * 13, seed + i));
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.82;
        a === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
      }
      g.closePath(); g.fill();
    }
    /* traffic wear lanes */
    for (let i = 0; i < 6; i++) {
      const y = R() * H;
      g.fillStyle = `rgba(140,130,74,${(0.04 + R() * 0.06).toFixed(3)})`;
      g.fillRect(0, y, W, 20 + R() * 60);
    }
    grain(g, W, H, 7000, 0.07, 2.2);
    return c;
  }

  /* ------------------------------------------------------------ ceiling tile */
  function makeCeiling(seed) {
    const R = VB.rngFrom(seed);
    const W = 512, H = 512;               // one texel block = a 2x2 tile group
    const { c, g } = cv(W, H);
    g.fillStyle = '#cdc4a4'; g.fillRect(0, 0, W, H);
    /* fissured mineral fibre — the classic random worm pattern */
    for (let i = 0; i < 2600; i++) {
      const x = R() * W, y = R() * H;
      g.strokeStyle = `rgba(120,112,88,${(0.10 + R() * 0.30).toFixed(3)})`;
      g.lineWidth = 0.7 + R() * 1.7;
      g.beginPath(); g.moveTo(x, y);
      let px = x, py = y, a = R() * 7;
      for (let k = 0; k < 5; k++) { a += (R() - 0.5) * 1.5; px += Math.cos(a) * 4; py += Math.sin(a) * 4; g.lineTo(px, py); }
      g.stroke();
    }
    for (let i = 0; i < 1800; i++) {
      const x = R() * W, y = R() * H, r = 0.6 + R() * 2.1;
      g.fillStyle = `rgba(108,100,78,${(0.12 + R() * 0.3).toFixed(3)})`;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    /* the T-grid, drawn into the texture edges (2 tiles across) */
    const grid = () => {
      g.fillStyle = '#8e8974';
      g.fillRect(0, 0, W, 5); g.fillRect(0, H - 5, W, 5);
      g.fillRect(0, 0, 5, H); g.fillRect(W - 5, 0, 5, H);
      g.fillRect(0, H / 2 - 2.5, W, 5); g.fillRect(W / 2 - 2.5, 0, 5, H);
      g.fillStyle = 'rgba(255,255,255,0.16)';
      g.fillRect(0, 1, W, 1); g.fillRect(0, H / 2 - 1.5, W, 1);
      g.fillStyle = 'rgba(0,0,0,0.28)';
      g.fillRect(0, 4, W, 1); g.fillRect(0, H / 2 + 1.5, W, 1);
    };
    /* water damage — brown tide rings, concentric, the tell of a wet ceiling */
    for (let i = 0; i < 5; i++) {
      const x = R() * W, y = R() * H, r = 25 + R() * 110;
      for (let ring = 3; ring >= 0; ring--) {
        const rr = r * (0.45 + ring * 0.19);
        const gr = g.createRadialGradient(x, y, rr * 0.7, x, y, rr);
        gr.addColorStop(0, 'rgba(0,0,0,0)');
        gr.addColorStop(0.82, `rgba(${(126 + ring * 8) | 0},${(88 + ring * 8) | 0},44,${(0.10 + ring * 0.045).toFixed(3)})`);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr;
        g.beginPath();
        for (let a = 0; a <= 6.6; a += 0.3) {
          const q = rr * (0.72 + 0.3 * VB.vnoise1(a * 2.1 + i * 7 + ring, seed));
          const px = x + Math.cos(a) * q, py = y + Math.sin(a) * q;
          a === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
        }
        g.closePath(); g.fill();
      }
    }
    grid();
    grain(g, W, H, 3000, 0.05, 1.8);
    return c;
  }

  /* -------------------------------------------------------- light diffuser */
  function makeDiffuser() {
    const W = 256, H = 128;
    const { c, g } = cv(W, H);
    g.fillStyle = '#fff6d8'; g.fillRect(0, 0, W, H);
    /* prismatic acrylic — a grid of little pyramids */
    for (let y = 0; y < H; y += 8) {
      for (let x = 0; x < W; x += 8) {
        g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(x, y, 7, 7);
        g.fillStyle = 'rgba(196,186,150,0.55)'; g.fillRect(x + 6, y, 2, 8);
        g.fillStyle = 'rgba(210,200,164,0.45)'; g.fillRect(x, y + 6, 8, 2);
      }
    }
    /* dead flies and dust in the bottom of the diffuser */
    for (let i = 0; i < 26; i++) {
      g.fillStyle = `rgba(50,42,26,${(0.25 + Math.random() * 0.5).toFixed(2)})`;
      const x = Math.random() * W, y = Math.random() * H;
      g.beginPath(); g.ellipse(x, y, 1.2 + Math.random() * 2.4, 0.8 + Math.random() * 1.2, Math.random() * 3, 0, 7); g.fill();
    }
    /* the two tubes showing through */
    for (const ty of [H * 0.3, H * 0.7]) {
      const gr = g.createLinearGradient(0, ty - 14, 0, ty + 14);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.5, 'rgba(255,255,255,0.75)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, ty - 14, W, 28);
    }
    return c;
  }

  const T = {};
  const M = {};

  return {
    init() {
      T.wall = tex(makeWall(9001), 1, 1);
      T.wallB = tex(makeWall(4242), 1, 1);
      T.carpet = tex(makeCarpet(777), 1, 1);
      T.ceiling = tex(makeCeiling(31337), 1, 1);
      T.diffuser = tex(makeDiffuser(), 1, 1);

      M.wall = new THREE.MeshLambertMaterial({ map: T.wall, color: 0xffffff });
      M.wallB = new THREE.MeshLambertMaterial({ map: T.wallB, color: 0xf6f2e2 });
      M.carpet = new THREE.MeshLambertMaterial({ map: T.carpet, color: 0xffffff });
      M.ceiling = new THREE.MeshLambertMaterial({ map: T.ceiling, color: 0xffffff });
      M.lightPanel = new THREE.MeshBasicMaterial({ map: T.diffuser, color: 0xfff2cc });
      M.baseboard = new THREE.MeshLambertMaterial({ color: 0x8f8348 });
      M.pillar = M.wall;
      M.doorFrame = new THREE.MeshLambertMaterial({ color: 0xb5a86a });

      VB.mats = M;
      VB.mats.tex = T;
      VB.mats.variant = (kind, n) => (n & 1 ? (M[kind + 'B'] || M[kind]) : M[kind]);
    },
  };
}, 5);


/* ==== 15_layout.js ====================================================== */
/* ============================================================================
   LAYOUT — endless procedural office. Chunk-streamed, fully deterministic from
   (seed, chunk coords), so walking a circle brings you back to the same room
   and there is nothing to "remember".

   Solidity is decided per world cell. Rooms come from a per-chunk BSP; chunk
   seams are decided by a hash of the shared edge so both sides agree.
   ========================================================================== */
VB.def('layout', function (VB, THREE) {
  const S = VB.S;

  const CELL = 2.6;          // metres per grid cell
  const CEIL = 2.72;         // ceiling height
  const CH = 8;              // cells per chunk edge
  const RADIUS = 2;          // chunks streamed around the player

  const chunks = new Map();  // "cx,cz" -> {group, solids:Uint8Array, fixtures:[]}
  const solidCache = new Map();
  const fixtures = [];
  let lastCell = null, lastRoomId = -1;

  const key = (a, b) => a + ',' + b;
  const floorDiv = (a, b) => Math.floor(a / b);

  /* ------------------------------------------------------- chunk solidity */
  /* Returns Uint8Array(CH*CH): 1 = solid. Cached. */
  function chunkSolids(gx, gz) {
    const k = key(gx, gz);
    let s = solidCache.get(k);
    if (s) return s;
    s = new Uint8Array(CH * CH);
    const R = VB.rngFrom(VB.hash2(gx, gz, S.seed));

    /* BSP: split the chunk into rooms with 1-cell walls and cut doorways. */
    const walls = [];
    (function split(x0, z0, x1, z1, depth) {
      const w = x1 - x0, h = z1 - z0;
      if (depth > 3 || (w < 4 && h < 4) || R() < 0.11) return;
      const vertical = w === h ? R() < 0.5 : w > h;
      if (vertical) {
        if (w < 4) return;
        const cut = x0 + 1 + Math.floor(R() * (w - 2));
        walls.push({ v: 1, at: cut, a: z0, b: z1 });
        split(x0, z0, cut, z1, depth + 1);
        split(cut + 1, z0, x1, z1, depth + 1);
      } else {
        if (h < 4) return;
        const cut = z0 + 1 + Math.floor(R() * (h - 2));
        walls.push({ v: 0, at: cut, a: x0, b: x1 });
        split(x0, z0, x1, cut, depth + 1);
        split(x0, cut + 1, x1, z1, depth + 1);
      }
    })(0, 0, CH, CH, 0);

    for (const w of walls) {
      const len = w.b - w.a;
      /* one or two doorways per wall run */
      const doors = [w.a + 1 + Math.floor(R() * Math.max(1, len - 2))];
      if (len > 5 && R() < 0.45) doors.push(w.a + 1 + Math.floor(R() * Math.max(1, len - 2)));
      for (let i = w.a; i < w.b; i++) {
        if (doors.indexOf(i) >= 0) continue;
        const x = w.v ? w.at : i, z = w.v ? i : w.at;
        if (x >= 0 && x < CH && z >= 0 && z < CH) s[z * CH + x] = 1;
      }
    }

    /* Seam walls: both neighbouring chunks derive these from the same hash, so
       they always agree and rooms read as continuous across the boundary. */
    for (let i = 0; i < CH; i++) {
      if (VB.hashf(gx, gz * CH + i, 8081) < 0.30 && VB.hashf(gx, gz * CH + i, 91) > 0.16) s[i * CH + 0] = 1;
      if (VB.hashf(gx * CH + i, gz, 4405) < 0.30 && VB.hashf(gx * CH + i, gz, 77) > 0.16) s[0 * CH + i] = 1;
    }

    /* Pillars in the wide-open parts — the load-bearing grid that no office
       this shape would ever actually need. */
    for (let z = 1; z < CH - 1; z++) {
      for (let x = 1; x < CH - 1; x++) {
        const wx = gx * CH + x, wz = gz * CH + z;
        if (((wx % 4) + 4) % 4 === 2 && ((wz % 4) + 4) % 4 === 2 && VB.hashf(wx, wz, 5150) < 0.5) {
          let open = true;
          for (let d = 0; d < 4; d++) {
            const nx = x + (d === 0 ? 1 : d === 1 ? -1 : 0), nz = z + (d === 2 ? 1 : d === 3 ? -1 : 0);
            if (s[nz * CH + nx]) { open = false; break; }
          }
          if (open) s[z * CH + x] = 2;   // 2 = pillar (solid, but narrower)
        }
      }
    }

    solidCache.set(k, s);
    if (solidCache.size > 400) solidCache.delete(solidCache.keys().next().value);
    return s;
  }

  function solidAtCell(wx, wz) {
    const gx = floorDiv(wx, CH), gz = floorDiv(wz, CH);
    const s = chunkSolids(gx, gz);
    return s[(wz - gz * CH) * CH + (wx - gx * CH)];
  }
  function solidAt(x, z) { return solidAtCell(Math.floor(x / CELL), Math.floor(z / CELL)) > 0; }

  /* -------------------------------------------------------------- meshing */
  function buildChunk(gx, gz) {
    const s = chunkSolids(gx, gz);
    const ox = gx * CH * CELL, oz = gz * CH * CELL;
    const group = new THREE.Group();
    const localFixtures = [];

    /* floor + ceiling planes for the whole chunk */
    const span = CH * CELL;
    const fg = new THREE.PlaneGeometry(span, span);
    fg.rotateX(-Math.PI / 2);
    const floor = new THREE.Mesh(fg, VB.mats.carpet);
    floor.position.set(ox + span / 2, 0, oz + span / 2);
    const cg = new THREE.PlaneGeometry(span, span);
    cg.rotateX(Math.PI / 2);
    const ceil = new THREE.Mesh(cg, VB.mats.ceiling);
    ceil.position.set(ox + span / 2, CEIL, oz + span / 2);
    /* uv tiling: carpet repeats per 2 cells, ceiling texture holds 2x2 tiles */
    for (const [m, rep] of [[floor, CH / 2], [ceil, CH / 2]]) {
      const uv = m.geometry.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rep, uv.getY(i) * rep);
      uv.needsUpdate = true;
    }
    group.add(floor, ceil);

    /* wall faces — emit only the faces that border an open cell */
    const pos = [], nor = [], uvs = [], idx = [];
    let vi = 0;
    function quad(ax, ay, az, bx, by, bz, cx2, cy2, cz2, dx, dy, dz, nx, ny, nz, u0, v0, u1, v1) {
      pos.push(ax, ay, az, bx, by, bz, cx2, cy2, cz2, dx, dy, dz);
      for (let i = 0; i < 4; i++) nor.push(nx, ny, nz);
      uvs.push(u0, v0, u1, v0, u1, v1, u0, v1);
      idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
      vi += 4;
    }
    const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let z = 0; z < CH; z++) {
      for (let x = 0; x < CH; x++) {
        const kind = s[z * CH + x];
        if (!kind) continue;
        const inset = kind === 2 ? 0.62 : 0;          // pillars are narrower
        const x0 = ox + x * CELL + inset * CELL * 0.5, x1 = ox + (x + 1) * CELL - inset * CELL * 0.5;
        const z0 = oz + z * CELL + inset * CELL * 0.5, z1 = oz + (z + 1) * CELL - inset * CELL * 0.5;
        const h = CEIL;
        for (let d = 0; d < 4; d++) {
          const nx = x + DIRS[d][0], nz = z + DIRS[d][1];
          const nSolid = (nx >= 0 && nx < CH && nz >= 0 && nz < CH)
            ? s[nz * CH + nx] : solidAtCell(gx * CH + nx, gz * CH + nz);
          if (nSolid && kind !== 2) continue;                 // interior face, skip
          const uw = (d < 2 ? (z1 - z0) : (x1 - x0)) / CELL;
          const u0 = (d < 2 ? z0 : x0) / CELL;
          if (d === 0) quad(x1, 0, z1, x1, 0, z0, x1, h, z0, x1, h, z1, 1, 0, 0, u0, 0, u0 + uw, 1);
          else if (d === 1) quad(x0, 0, z0, x0, 0, z1, x0, h, z1, x0, h, z0, -1, 0, 0, u0, 0, u0 + uw, 1);
          else if (d === 2) quad(x0, 0, z1, x1, 0, z1, x1, h, z1, x0, h, z1, 0, 0, 1, u0, 0, u0 + uw, 1);
          else quad(x1, 0, z0, x0, 0, z0, x0, h, z0, x1, h, z0, 0, 0, -1, u0, 0, u0 + uw, 1);
        }
      }
    }
    if (pos.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setIndex(idx);
      g.computeBoundingSphere();
      group.add(new THREE.Mesh(g, VB.mats.variant('wall', VB.hash2(gx, gz, 3) & 1)));
    }

    /* light troffers, on a grid, mostly in open cells, some dead */
    const panelGeo = new THREE.PlaneGeometry(1.16, 0.58);
    panelGeo.rotateX(Math.PI / 2);
    for (let z = 0; z < CH; z++) {
      for (let x = 0; x < CH; x++) {
        const wx = gx * CH + x, wz = gz * CH + z;
        if (((wx % 3) + 3) % 3 !== 1 || ((wz % 3) + 3) % 3 !== 1) continue;
        if (s[z * CH + x]) continue;
        const px = ox + (x + 0.5) * CELL, pz = oz + (z + 0.5) * CELL;
        const dead = VB.hashf(wx, wz, 616) < 0.10;
        const m = new THREE.Mesh(panelGeo, VB.mats.lightPanel.clone());
        m.position.set(px, CEIL - 0.012, pz);
        m.material.color.setHex(dead ? 0x2a2a24 : 0xfff2cc);
        group.add(m);
        const fx = { pos: new THREE.Vector3(px, CEIL - 0.10, pz), on: !dead, mesh: m, level: dead ? 0 : 1 };
        localFixtures.push(fx);
        fixtures.push(fx);
      }
    }

    VB.scene.add(group);
    chunks.set(key(gx, gz), { group, fixtures: localFixtures });
  }

  function dropChunk(k) {
    const c = chunks.get(k);
    if (!c) return;
    VB.scene.remove(c.group);
    c.group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material._isClone) o.material.dispose();
    });
    for (const f of c.fixtures) { const i = fixtures.indexOf(f); if (i >= 0) fixtures.splice(i, 1); }
    chunks.delete(k);
  }

  function stream() {
    const gx = floorDiv(Math.floor(S.pos.x / CELL), CH), gz = floorDiv(Math.floor(S.pos.z / CELL), CH);
    for (let dz = -RADIUS; dz <= RADIUS; dz++) {
      for (let dx = -RADIUS; dx <= RADIUS; dx++) {
        const k = key(gx + dx, gz + dz);
        if (!chunks.has(k)) { buildChunk(gx + dx, gz + dz); return; }  // one per frame
      }
    }
    for (const k of chunks.keys()) {
      const [a, b] = k.split(',').map(Number);
      if (Math.abs(a - gx) > RADIUS + 1 || Math.abs(b - gz) > RADIUS + 1) { dropChunk(k); return; }
    }
  }

  function reset() {
    for (const k of Array.from(chunks.keys())) dropChunk(k);
    solidCache.clear();
    fixtures.length = 0;
  }

  /* ------------------------------------------------------------ collision */
  const _v = new THREE.Vector3();
  function collide(p, r) {
    for (let axis = 0; axis < 2; axis++) {
      const c = axis === 0 ? p.x : p.z;
      const oc = axis === 0 ? p.z : p.x;
      const ci = Math.floor(c / CELL), oi = Math.floor(oc / CELL);
      for (let d = -1; d <= 1; d++) {
        for (let e = -1; e <= 1; e++) {
          const cx = axis === 0 ? ci + d : oi + e;
          const cz = axis === 0 ? oi + e : ci + d;
          const kind = solidAtCell(cx, cz);
          if (!kind) continue;
          const inset = kind === 2 ? 0.62 * CELL * 0.5 : 0;
          const minX = cx * CELL + inset, maxX = (cx + 1) * CELL - inset;
          const minZ = cz * CELL + inset, maxZ = (cz + 1) * CELL - inset;
          const nx = VB.clamp(p.x, minX, maxX), nz = VB.clamp(p.z, minZ, maxZ);
          const dx = p.x - nx, dz = p.z - nz;
          const d2 = dx * dx + dz * dz;
          if (d2 < r * r) {
            if (d2 > 1e-8) {
              const dist = Math.sqrt(d2), push = r - dist;
              p.x += (dx / dist) * push; p.z += (dz / dist) * push;
            } else {
              p.x = p.x < (minX + maxX) / 2 ? minX - r : maxX + r;
            }
          }
        }
      }
    }
  }

  /* --------------------------------------------------------- grid raycast */
  function raycastWalls(origin, dir, maxD) {
    let x = origin.x, z = origin.z;
    const step = 0.12;
    for (let t = 0; t < maxD; t += step) {
      x += dir.x * step; z += dir.z * step;
      if (solidAt(x, z)) return t;
    }
    return Infinity;
  }

  function randomOpenPointNear(x, z, minR, maxR) {
    for (let i = 0; i < 48; i++) {
      const a = Math.random() * 7, r = minR + Math.random() * (maxR - minR);
      const px = x + Math.cos(a) * r, pz = z + Math.sin(a) * r;
      if (!solidAt(px, pz)) return { x: px, z: pz };
    }
    return null;
  }

  /* Open on a view, never nose-first into a wall: take the roomiest cell near
     the origin and face it down its longest clear run. */
  function spawn() {
    let best = null;
    for (let z = -6; z <= 6; z++) {
      for (let x = -6; x <= 6; x++) {
        if (solidAtCell(x, z)) continue;
        let open = 0;
        for (let b = -2; b <= 2; b++) for (let a = -2; a <= 2; a++) if (!solidAtCell(x + a, z + b)) open++;
        const score = open - Math.hypot(x, z) * 0.35;
        if (!best || score > best.score) best = { x, z, score };
      }
    }
    if (!best) best = { x: 0, z: 0 };
    S.pos.set((best.x + 0.5) * CELL, VB.cfg.eyeHeight, (best.z + 0.5) * CELL);

    let bestYaw = 0, bestRun = -1;
    for (let i = 0; i < 16; i++) {
      const yaw = (i / 16) * Math.PI * 2;
      let run = 0;
      for (let d = 0.5; d < 26; d += 0.4) {
        if (solidAt(S.pos.x - Math.sin(yaw) * d, S.pos.z - Math.cos(yaw) * d)) break;
        run = d;
      }
      if (run > bestRun) { bestRun = run; bestYaw = yaw; }
    }
    S.yaw = bestYaw;
    VB.camera.rotation.order = 'YXZ';
    VB.camera.rotation.y = bestYaw;
  }

  return {
    init() {
      VB.layout = {
        CELL, CEIL, CH,
        solidAt, collide, raycastWalls, randomOpenPointNear,
        floorY: () => 0,
        ceilY: () => CEIL,
        roomKindAt: (x, z) => 'office',
        fixtures,
        chunkCount: () => chunks.size,
      };
      VB.on('world:reseed', () => { reset(); spawn(); });
      VB.on('player:teleport', () => { stream(); });
      spawn();
    },

    update(dt) {
      stream();
      const cx = Math.floor(S.pos.x / CELL), cz = Math.floor(S.pos.z / CELL);
      if (!lastCell || lastCell.cx !== cx || lastCell.cz !== cz) {
        lastCell = { cx, cz };
        S.cell = lastCell;
        /* "room" identity = flood region id approximated by a coarse hash */
        const rid = VB.hash2(floorDiv(cx, 3), floorDiv(cz, 3), 9);
        if (rid !== lastRoomId) {
          lastRoomId = rid;
          S.anomaly = VB.hashf(cx, cz, 1234) * 0.6;
          VB.emit('room:enter', { cx, cz, kind: 'office' });
        }
      }
    },
  };
}, 15);


/* ==== 20_lighting.js ==================================================== */
/* ============================================================================
   LIGHTING — a small pool of point lights chases the nearest ceiling troffers.
   Fluorescents do not glow steadily: they buzz at 120Hz, some strobe, some are
   half-dead and pink.
   ========================================================================== */
VB.def('lighting', function (VB, THREE) {
  const S = VB.S;
  const POOL = 7;
  const lights = [];
  const state = new Map();   // fixture -> {phase, mode, level}

  function fixtureState(f) {
    let st = state.get(f);
    if (!st) {
      const h = VB.hashf(Math.round(f.pos.x * 10), Math.round(f.pos.z * 10), 4242);
      st = {
        phase: h * 100,
        /* 0 steady, 1 slow strobe, 2 dying stutter, 3 dead */
        mode: !f.on ? 3 : h < 0.08 ? 2 : h < 0.19 ? 1 : 0,
        level: 1,
      };
      state.set(f, st);
    }
    return st;
  }

  return {
    init() {
      VB.scene.fog = new THREE.Fog(0x6b6134, 4.0, 30.0);
      const amb = new THREE.AmbientLight(0xd6c795, 1.15);
      VB.scene.add(amb);
      /* bounce off the yellow everything */
      const hemi = new THREE.HemisphereLight(0xf5e6ae, 0x7d6f38, 0.45);
      VB.scene.add(hemi);
      for (let i = 0; i < POOL; i++) {
        const l = new THREE.PointLight(0xfff0c8, 0, 13, 1.75);
        l.visible = false;
        VB.scene.add(l);
        lights.push({ light: l, fx: null });
      }
      VB.lighting = {
        buzzAt(x, z) {
          let best = 0;
          for (const f of VB.layout.fixtures) {
            const d = Math.hypot(f.pos.x - x, f.pos.z - z);
            if (d < 9) best = Math.max(best, (1 - d / 9) * fixtureState(f).level);
          }
          return best;
        },
        brightnessAt(x, z) { return this.buzzAt(x, z); },
      };
    },

    update(dt) {
      const fixtures = VB.layout ? VB.layout.fixtures : [];
      /* pick the N nearest fixtures */
      const near = [];
      for (const f of fixtures) {
        const d = (f.pos.x - S.pos.x) ** 2 + (f.pos.z - S.pos.z) ** 2;
        if (d < 260) near.push({ f, d });
      }
      near.sort((a, b) => a.d - b.d);

      for (let i = 0; i < POOL; i++) {
        const slot = lights[i];
        const pick = near[i];
        if (!pick) { slot.light.visible = false; slot.fx = null; continue; }
        const f = pick.f, st = fixtureState(f);

        /* 120Hz ripple is aliased by a 60Hz field rate into a slow crawl —
           which is exactly what fluorescents look like on video. */
        const t = S.t + st.phase;
        let lvl;
        if (st.mode === 3) lvl = 0;
        else if (st.mode === 1) lvl = 0.55 + 0.45 * (Math.sin(t * 11.3) > 0.55 ? 1 : 0.12);
        else if (st.mode === 2) {
          const n = VB.fbm1(t * 7.1, 3, 77);
          lvl = n < 0.42 ? 0.06 + Math.random() * 0.12 : 0.78 + 0.22 * Math.sin(t * 47);
        } else lvl = 0.93 + 0.07 * Math.sin(t * 7.53) + 0.03 * Math.sin(t * 118.0);

        /* entity proximity browns everything out */
        lvl *= 1 - S.prox * 0.55;
        st.level = lvl;

        slot.light.visible = lvl > 0.01;
        slot.light.position.copy(f.pos);
        slot.light.intensity = lvl * 9.0;
        slot.light.distance = 13.0;
        slot.light.color.setHSL(0.12, 0.22 - lvl * 0.10, 0.5);
        if (f.mesh) f.mesh.material.color.setRGB(lvl * 1.0, lvl * 0.95, lvl * 0.80);
        if (st.mode !== 0 && Math.random() < dt * 2) VB.emit('light:flicker', { pos: f.pos, amt: lvl });
        slot.fx = f;
      }

      /* fog closes in as dread rises */
      if (VB.scene.fog) {
        VB.scene.fog.far = VB.approach(VB.scene.fog.far, 30 - S.dread * 10 - S.prox * 7, 1.2, dt);
        VB.scene.fog.near = 3.6 - S.prox * 1.6;
      }
    },
  };
}, 20);


/* ==== 25_entity.js ====================================================== */
/* ============================================================================
   ENTITY — placeholder. Owns S.prox / S.seen / S.stalked.
   ========================================================================== */
VB.def('entity', function (VB, THREE) {
  return {
    init() { VB.entity = { pos: null, active: false, dist: Infinity }; },
    update(dt) {
      VB.S.prox = VB.approach(VB.S.prox, 0, 1, dt);
    },
  };
}, 25);


/* ==== 30_player.js ====================================================== */
/* ============================================================================
   PLAYER — the person holding the camcorder.

   The camera is not mounted to a head; it is held at chest height in two tired
   hands. It lags behind the intent, overshoots, drifts, and breathes. Nothing
   here is critically damped — a perfectly-tracking camera reads as a game.
   ========================================================================== */
VB.def('player', function (VB, THREE) {
  const S = VB.S, cfg = VB.cfg;

  /* look: `want` is the mouse-integrated intent, S.yaw/pitch is where the
     operator's hands have actually got to. */
  let wantYaw = 0, wantPitch = 0, appliedYaw = 0, appliedPitch = 0;
  let velYaw = 0, velPitch = 0;      // spring velocity, gives the overshoot
  let roll = 0, rollVel = 0;

  const vel = new THREE.Vector3();
  const keys = Object.create(null);
  let locked = false, bobAmt = 0, lastFoot = 0, stepPhase = 0;
  let breath = 0, breathRate = 0.24, stamina = 1;
  let sway = 0;
  let flashOn = true;
  const tmp = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3();

  /* ------------------------------------------------------------- input */
  function onKey(e, down) {
    const k = e.code;
    keys[k] = down;
    if (down && (k === 'KeyE' || k === 'Space')) interact();
    if (down && k === 'KeyF') { flashOn = !flashOn; VB.emit('player:flashlight', { on: flashOn }); }
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ShiftLeft'].indexOf(k) >= 0) e.preventDefault();
  }
  function onMove(e) {
    if (!locked) return;
    /* 1987 camcorder operators are not esports players — deliberately slow. */
    const sens = 0.00165;
    wantYaw -= e.movementX * sens;
    wantPitch -= e.movementY * sens;
    wantPitch = VB.clamp(wantPitch, -1.15, 1.15);
  }
  function interact() {
    if (!VB.running) return;
    fwd.set(-Math.sin(S.yaw) * Math.cos(S.pitch), Math.sin(S.pitch), -Math.cos(S.yaw) * Math.cos(S.pitch));
    const d = VB.layout && VB.layout.raycastWalls ? VB.layout.raycastWalls(S.pos, fwd, 2.2) : Infinity;
    VB.emit('player:interact', { hit: isFinite(d) ? d : null, pos: S.pos.clone(), dir: fwd.clone() });
  }

  function requestLock() {
    const el = document.getElementById('hit');
    if (el && el.requestPointerLock) el.requestPointerLock();
    VB.start();
  }

  return {
    init() {
      const hit = document.getElementById('hit');
      hit.addEventListener('mousedown', requestLock);
      document.addEventListener('pointerlockchange', () => {
        locked = document.pointerLockElement === document.getElementById('hit');
      });
      document.addEventListener('mousemove', onMove);
      window.addEventListener('keydown', e => onKey(e, true));
      window.addEventListener('keyup', e => onKey(e, false));
      window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
      VB.on('player:teleport', () => { vel.set(0, 0, 0); wantYaw = S.yaw; });
      VB.player = {
        get locked() { return locked; },
        get flashOn() { return flashOn; },
        interact,
      };
    },

    update(dt) {
      /* ---------------------------------------------------------- look */
      /* If anything outside this module moved the view (spawn placement, a
         teleport, a scripted glance) adopt it as the new intent instead of
         springing back to where the mouse thinks we were pointing. */
      if (Math.abs(S.yaw - appliedYaw) > 1e-6 || Math.abs(S.pitch - appliedPitch) > 1e-6) {
        wantYaw = S.yaw; wantPitch = S.pitch; velYaw = 0; velPitch = 0;
      }

      /* Under-damped spring: the hands arrive late and go slightly past. */
      const kSpring = 118, kDamp = 15.5;
      velYaw += (wantYaw - S.yaw) * kSpring * dt; velYaw -= velYaw * kDamp * dt;
      velPitch += (wantPitch - S.pitch) * kSpring * dt; velPitch -= velPitch * kDamp * dt;
      const dyaw = velYaw * dt;
      S.yaw += dyaw; S.pitch += velPitch * dt;
      appliedYaw = S.yaw; appliedPitch = S.pitch;

      /* S.turn is what the tape reacts to — normalise against a brisk pan. */
      const rawTurn = Math.min(1, Math.abs(velYaw) / 3.1 + Math.abs(velPitch) / 3.6);
      S.turn = VB.approach(S.turn, rawTurn, rawTurn > S.turn ? 26 : 5.5, dt);

      /* --------------------------------------------------------- drive */
      const run = !!keys.ShiftLeft && stamina > 0.06;
      let ix = 0, iz = 0;
      if (keys.KeyW || keys.ArrowUp) iz -= 1;
      if (keys.KeyS || keys.ArrowDown) iz += 1;
      if (keys.KeyA || keys.ArrowLeft) ix -= 1;
      if (keys.KeyD || keys.ArrowRight) ix += 1;
      const inLen = Math.hypot(ix, iz);
      if (inLen > 0) { ix /= inLen; iz /= inLen; }

      const speed = run ? cfg.runSpeed : cfg.walkSpeed;
      fwd.set(-Math.sin(S.yaw), 0, -Math.cos(S.yaw));
      right.set(Math.cos(S.yaw), 0, -Math.sin(S.yaw));
      tmp.set(0, 0, 0).addScaledVector(fwd, -iz * speed).addScaledVector(right, ix * speed);
      /* boots on damp carpet: slow to start, slower to stop */
      const accel = inLen > 0 ? 11 : 8.5;
      vel.x = VB.approach(vel.x, tmp.x, accel, dt);
      vel.z = VB.approach(vel.z, tmp.z, accel, dt);

      S.pos.x += vel.x * dt; S.pos.z += vel.z * dt;
      if (VB.layout && VB.layout.collide) VB.layout.collide(S.pos, cfg.playerRadius);

      const spd = Math.hypot(vel.x, vel.z);
      S.move = VB.clamp(spd / cfg.walkSpeed, 0, 1.8);
      S.running = run && spd > 0.6 ? VB.approach(S.running, 1, 6, dt) : VB.approach(S.running, 0, 4, dt);
      stamina = VB.clamp(stamina + (run && spd > 0.6 ? -dt * 0.075 : dt * 0.045), 0, 1);

      /* ----------------------------------------------------- head bob */
      /* Two footfalls per cycle; the vertical is the double-frequency term. */
      const stride = run ? 9.2 : 6.35;
      stepPhase += spd * dt * (stride / Math.max(0.9, cfg.walkSpeed));
      S.bobPhase = stepPhase;
      bobAmt = VB.approach(bobAmt, VB.clamp(spd / cfg.walkSpeed, 0, 1.5), 7, dt);

      const foot = Math.floor(stepPhase / Math.PI);
      if (foot !== lastFoot && bobAmt > 0.18) {
        lastFoot = foot;
        VB.emit('player:step', { foot: foot & 1, speed: spd, pos: S.pos });
      }

      /* -------------------------------------------- breathing + sway */
      breathRate = 0.22 + S.running * 0.5 + (1 - stamina) * 0.42 + S.dread * 0.30;
      breath += dt * breathRate * Math.PI * 2;
      const breathDepth = 0.0075 + (1 - stamina) * 0.019 + S.dread * 0.011;

      /* operator drift — never still, low frequency, unrepeating */
      const dr = 1 + S.dread * 1.5;
      const nY = (VB.fbm1(S.t * 0.33, 4, 11) - 0.5) * 0.030 * dr;
      const nP = (VB.fbm1(S.t * 0.29, 4, 29) - 0.5) * 0.024 * dr;
      const nR = (VB.fbm1(S.t * 0.21, 3, 53) - 0.5) * 0.055 * dr;

      /* body roll into strafes + the swing of the arm carrying the camera */
      sway = VB.approach(sway, -ix * 0.055, 4.5, dt);
      const targetRoll = sway + Math.sin(stepPhase) * 0.021 * bobAmt + nR - dyaw * 1.9;
      rollVel += (targetRoll - roll) * 90 * dt; rollVel -= rollVel * 13 * dt;
      roll += rollVel * dt;

      const bobY = Math.cos(stepPhase * 2) * 0.034 * bobAmt;
      const bobX = Math.sin(stepPhase) * 0.030 * bobAmt;
      const breathY = Math.sin(breath) * breathDepth;

      /* ------------------------------------------------------- camera */
      const cam = VB.camera;
      cam.position.set(
        S.pos.x + right.x * bobX + fwd.x * (Math.sin(stepPhase * 2) * 0.012 * bobAmt),
        S.pos.y + bobY + breathY - S.running * 0.03,
        S.pos.z + right.z * bobX + fwd.z * (Math.sin(stepPhase * 2) * 0.012 * bobAmt)
      );
      cam.rotation.set(0, 0, 0);
      cam.rotation.order = 'YXZ';
      cam.rotation.y = S.yaw + nY;
      cam.rotation.x = S.pitch + nP + Math.sin(stepPhase * 2 + 1.1) * 0.010 * bobAmt;
      cam.rotation.z = roll;
    },
  };
}, 10);

VB.def('audio', function (VB, THREE) {

    init() { VB.audio = { ctx: null, master: null, unlock() {}, sfx() {} }; },

/* ==== 60_postfx.js ====================================================== */
/* ============================================================================
   POSTFX — the tape.

   Structure (do not flatten these; each stage models a different physical
   thing and they must happen in this order):

     renderField()  scene -> rtField[field]           the CCD, twice per frame
     present()      weave two fields -> rtWeave       29.97fps interlaced frame
                    optics pass      -> rtOptics      lens: soft, CA, vignette
                    tape pass        -> rtTape        Y/C bandwidth, noise, tears
                    display pass     -> canvas        scanlines, bloom, levels

   This is a structurally-complete baseline. The bandwidth model is real but
   thin — head-switching, dropouts, ringing and time-base error live here and
   are where the authenticity is won or lost.
   ========================================================================== */
VB.def('postfx', function (VB, THREE) {
  const S = VB.S, cfg = VB.cfg;
  const R = VB.renderer;

  const quadGeo = new THREE.PlaneGeometry(2, 2);
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quadScene = new THREE.Scene();
  const quad = new THREE.Mesh(quadGeo, null);
  quadScene.add(quad);

  function rt(w, h) {
    return new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
      depthBuffer: true, stencilBuffer: false,
    });
  }

  let rtField = [], rtWeave, rtOptics, rtTape;

  /* The CCD buffers are sRGB-encoded so the scene lands in them gamma-encoded.
     Every stage after this operates on a gamma-encoded signal — which is not a
     shortcut, it is what a real composite chain does. NTSC luma is Y' of
     gamma-corrected primaries; doing the Y/C split in linear light would give
     the wrong noise distribution and the wrong black lift.
     The intermediate targets stay unconverted so no stage double-encodes. */
  function ccd(w, h) {
    const r = rt(w, h);
    r.texture.colorSpace = THREE.SRGBColorSpace;
    return r;
  }

  const COMMON = `
    precision highp float;
    varying vec2 vUv;
    float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    /* The CCD targets are SRGB8, so the GPU hands us linear light on sample.
       Re-encode once, at the weave, and every stage downstream then operates on
       a gamma-encoded signal — which is what a composite chain actually carries. */
    vec3 toSignal(vec3 c){
      c = clamp(c, 0.0, 1.0);
      return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c));
    }
  `;
  const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`;

  /* ------------------------------------------------------------ weave */
  const weaveMat = new THREE.ShaderMaterial({
    uniforms: { tA: { value: null }, tB: { value: null }, res: { value: new THREE.Vector2() } },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tA, tB; uniform vec2 res;
      void main(){
        float line = floor(vUv.y * res.y);
        /* odd lines from the older field, even from the newer: real combing */
        vec3 c = mod(line, 2.0) < 1.0 ? texture2D(tA, vUv).rgb : texture2D(tB, vUv).rgb;
        gl_FragColor = vec4(toSignal(c), 1.0);
      }`,
  });

  /* ----------------------------------------------------------- optics */
  const opticsMat = new THREE.ShaderMaterial({
    uniforms: {
      tD: { value: null }, res: { value: new THREE.Vector2() },
      t: { value: 0 }, wear: { value: 0 },
    },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD; uniform vec2 res; uniform float t, wear;
      void main(){
        vec2 uv = vUv;
        vec2 d = uv - 0.5;
        /* lateral chromatic aberration, zero in the centre, strong at the edge */
        float ca = (0.0016 + wear*0.0012) * dot(d,d) * 4.0;
        vec3 c;
        c.r = texture2D(tD, uv + d*ca).r;
        c.g = texture2D(tD, uv).g;
        c.b = texture2D(tD, uv - d*ca).b;
        /* a 1987 CCD is simply not sharp */
        vec2 px = 1.0/res;
        vec3 blur = (texture2D(tD, uv+vec2(px.x,0)).rgb + texture2D(tD, uv-vec2(px.x,0)).rgb
                   + texture2D(tD, uv+vec2(0,px.y)).rgb + texture2D(tD, uv-vec2(0,px.y)).rgb)*0.25;
        c = mix(c, blur, 0.42);
        /* vignette */
        float v = 1.0 - dot(d,d)*1.15;
        c *= clamp(v, 0.0, 1.0);
        gl_FragColor = vec4(c, 1.0);
      }`,
  });

  /* ------------------------------------------------------------- tape */
  const tapeMat = new THREE.ShaderMaterial({
    uniforms: {
      tD: { value: null }, tHud: { value: null }, res: { value: new THREE.Vector2() },
      t: { value: 0 }, wear: { value: 0 }, turn: { value: 0 }, pulse: { value: 0 },
      burst: { value: 0 }, dread: { value: 0 }, dropout: { value: 0 },
    },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD, tHud; uniform vec2 res;
      uniform float t, wear, turn, pulse, burst, dread, dropout;

      const mat3 RGB2YIQ = mat3(0.299,0.596,0.211, 0.587,-0.274,-0.523, 0.114,-0.322,0.312);
      const mat3 YIQ2RGB = mat3(1.0,1.0,1.0, 0.956,-0.272,-1.106, 0.619,-0.647,1.703);

      vec3 sampleYIQ(vec2 uv){
        vec3 rgb = texture2D(tD, uv).rgb;
        vec4 h = texture2D(tHud, vec2(uv.x, 1.0-uv.y));
        rgb = mix(rgb, h.rgb, h.a);      /* OSD is burned in before the tape */
        return RGB2YIQ * rgb;
      }

      void main(){
        vec2 uv = vUv;
        float line = floor(uv.y * res.y);

        /* --- time base error: every scanline is horizontally mispositioned */
        float tbe = (hash21(vec2(line, floor(t*29.97)))-0.5) * (0.0006 + wear*0.0022);
        tbe += sin(uv.y*61.0 + t*3.1)*0.0004;

        /* --- tracking band travelling up the frame, worse on movement */
        float trackAmt = turn*0.6 + pulse*0.9 + wear*0.3;
        float bandPos = fract(-t*0.19);
        float band = smoothstep(0.10, 0.0, abs(fract(uv.y - bandPos + 0.5) - 0.5));
        float tear = band * trackAmt * 0.055;

        /* --- head switching: the bottom of every frame is torn. always. */
        float hs = smoothstep(0.030, 0.0, uv.y);
        float hsShift = hs * (0.02 + wear*0.05) * (0.6 + 0.4*sin(t*13.0));

        float xoff = tbe + tear + hsShift;

        /* --- luma: band-limited horizontally, with overshoot ringing */
        float px = 1.0/res.x;
        float y = 0.0;
        y += sampleYIQ(uv + vec2(xoff - 2.0*px,0)).x * 0.10;
        y += sampleYIQ(uv + vec2(xoff - 1.0*px,0)).x * 0.24;
        y += sampleYIQ(uv + vec2(xoff,0)).x           * 0.36;
        y += sampleYIQ(uv + vec2(xoff + 1.0*px,0)).x * 0.24;
        y += sampleYIQ(uv + vec2(xoff + 2.0*px,0)).x * 0.10;
        float sharp = sampleYIQ(uv + vec2(xoff,0)).x;
        y = y + (sharp - y) * (1.0 + 0.9);          /* VCR detail circuit */

        /* --- chroma: ~1/8 the bandwidth of luma, and it lags to the right */
        vec2 iq = vec2(0.0);
        float wsum = 0.0;
        for(int k=-8;k<=8;k++){
          float w = 1.0 - abs(float(k))/9.0;
          iq += sampleYIQ(uv + vec2(xoff + float(k)*px*1.6 - px*3.0, 0.0)).yz * w;
          wsum += w;
        }
        iq /= wsum;
        iq *= (1.0 - wear*0.35);                     /* colour dies with age */

        /* --- noise: luma streaky, chroma coarse and blotchy */
        float ln = (hash21(vec2(floor(uv.x*res.x*0.4), line + floor(t*59.94)))-0.5);
        y += ln * (0.020 + wear*0.055 + dread*0.02);
        vec2 cn = vec2(hash21(vec2(floor(uv.x*res.x*0.06), line*0.25 + floor(t*29.97))),
                       hash21(vec2(floor(uv.x*res.x*0.06)+31.0, line*0.25 + floor(t*29.97))))-0.5;
        iq += cn * (0.030 + wear*0.075);

        /* --- dropouts: bright dashes where the oxide has shed */
        float doLine = step(0.9975 - dropout*0.02 - wear*0.004, hash21(vec2(line, floor(t*29.97))));
        float doX = step(0.986, hash21(vec2(floor(uv.x*res.x*0.25), line+7.0)));
        y = mix(y, 1.05, doLine*doX);

        /* --- head switch noise fill */
        y = mix(y, hash21(vec2(uv.x*res.x, line+t*90.0)), hs * (0.35 + wear*0.4));

        /* --- static burst */
        if(burst > 0.001){
          float sb = hash21(vec2(floor(uv.x*res.x*0.5), line + floor(t*400.0)));
          float m = step(1.0-burst*0.7, hash21(vec2(line, floor(t*80.0))));
          y = mix(y, sb, m*burst*0.9);
          iq = mix(iq, (vec2(sb, 1.0-sb)-0.5)*0.6, m*burst*0.8);
        }

        vec3 rgb = YIQ2RGB * vec3(y, iq);

        /* --- tape levels: blacks lifted and milky, highlights clipped */
        rgb = clamp(rgb, -0.1, 1.6);
        rgb = rgb * (1.0 - wear*0.10) + 0.045 + wear*0.035;
        gl_FragColor = vec4(rgb, 1.0);
      }`,
  });

  /* ---------------------------------------------------------- display */
  const dispMat = new THREE.ShaderMaterial({
    uniforms: { tD: { value: null }, res: { value: new THREE.Vector2() }, t: { value: 0 }, wear: { value: 0 } },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD; uniform vec2 res; uniform float t, wear;
      void main(){
        vec2 uv = vUv;
        vec3 c = texture2D(tD, uv).rgb;
        /* horizontal-only bloom, because that is how a tape smears */
        vec3 bl = vec3(0.0);
        for(int k=-4;k<=4;k++) bl += texture2D(tD, uv+vec2(float(k)/res.x*3.0,0.0)).rgb;
        bl /= 9.0;
        c += max(bl - 0.62, 0.0) * 0.85;
        /* scanlines */
        float sl = 0.90 + 0.10*cos(uv.y*res.y*3.14159*2.0);
        c *= sl;
        c = clamp(c, 0.0, 1.0);
        gl_FragColor = vec4(c, 1.0);
      }`,
  });

  function blit(mat, target) {
    quad.material = mat;
    R.setRenderTarget(target || null);
    R.render(quadScene, quadCam);
  }

  function alloc(w, h) {
    for (const r of rtField) r && r.dispose();
    rtField = [ccd(w, h), ccd(w, h)];
    for (const r of [rtWeave, rtOptics, rtTape]) r && r.dispose();
    rtWeave = rt(w, h); rtOptics = rt(w, h); rtTape = rt(w, h);
    const v = new THREE.Vector2(w, h);
    weaveMat.uniforms.res.value = v;
    opticsMat.uniforms.res.value = v;
    tapeMat.uniforms.res.value = v;
    dispMat.uniforms.res.value = v;
  }

  return {
    get __rts() { return { fieldA: rtField[0], fieldB: rtField[1], weave: rtWeave, optics: rtOptics, tape: rtTape }; },
    init() { alloc(cfg.sceneW, cfg.sceneH); },
    resize(w, h) { alloc(w, h); },

    renderField(scene, camera, field) {
      R.setRenderTarget(rtField[field]);
      R.clear(true, true, false);
      R.render(scene, camera);
      R.setRenderTarget(null);
    },

    present() {
      weaveMat.uniforms.tA.value = rtField[0].texture;
      weaveMat.uniforms.tB.value = rtField[1].texture;
      blit(weaveMat, rtWeave);

      opticsMat.uniforms.tD.value = rtWeave.texture;
      opticsMat.uniforms.t.value = S.t;
      opticsMat.uniforms.wear.value = S.wear;
      blit(opticsMat, rtOptics);

      const u = tapeMat.uniforms;
      u.tD.value = rtOptics.texture;
      u.tHud.value = VB.hud ? VB.hud.texture : null;
      u.t.value = S.t; u.wear.value = S.wear; u.turn.value = S.turn;
      u.pulse.value = S.roomPulse; u.burst.value = S.burst;
      u.dread.value = S.dread; u.dropout.value = S.dropout;
      blit(tapeMat, rtTape);

      dispMat.uniforms.tD.value = rtTape.texture;
      dispMat.uniforms.t.value = S.t;
      dispMat.uniforms.wear.value = S.wear;
      blit(dispMat, null);
    },

    repaint() {
      dispMat.uniforms.tD.value = rtTape.texture;
      blit(dispMat, null);
    },
  };
}, 70);


/* ==== 65_hud.js ========================================================= */
/* ============================================================================
   HUD — camcorder on-screen display, drawn to a canvas that postfx composites
   inside the tape stage so the characters degrade with the signal.
   ========================================================================== */
VB.def('hud', function (VB, THREE) {
  let c, g, tx;
  return {
    init() {
      c = document.createElement('canvas');
      c.width = 640; c.height = 480;
      g = c.getContext('2d');
      tx = new THREE.CanvasTexture(c);
      tx.minFilter = THREE.LinearFilter; tx.magFilter = THREE.LinearFilter;
      tx.generateMipmaps = false;
      VB.hud = { texture: tx, w: c.width, h: c.height };
    },
    lateUpdate() {
      g.clearRect(0, 0, c.width, c.height);
      g.font = 'bold 22px monospace';
      g.fillStyle = '#fff';
      g.fillText('REC', 62, 46);
      g.beginPath(); g.arc(46, 39, 8, 0, 7); g.fill();
      tx.needsUpdate = true;
    },
  };
}, 60);


/* ==== 80_perf.js ======================================================== */
/* ============================================================================

VB.def('perf', function (VB, THREE) {
  return { init() { VB.quality = 1; } };

/* ==== 99_boot.js ======================================================== */
/* ============================================================================
   BOOT — renderer, module instantiation, the director, and the 59.94Hz field
   clock. Presents at 29.97fps by weaving two temporally-distinct fields.
   ========================================================================== */
(function boot() {
  const S = VB.S, cfg = VB.cfg;

  /* ------------------------------------------------------------ renderer */
  const canvas = document.getElementById('screen');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: false, alpha: false, powerPreference: 'high-performance',
    stencil: false, depth: true,
  });
  renderer.setPixelRatio(1);
  renderer.setSize(cfg.sceneW, cfg.sceneH, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 1);
  VB.renderer = renderer;
  VB.canvas = canvas;

  const scene = new THREE.Scene();
  VB.scene = scene;
  const camera = new THREE.PerspectiveCamera(cfg.fov, cfg.aspect, 0.02, 60);
  VB.camera = camera;
  S.pos = new THREE.Vector3(0, cfg.eyeHeight, 0);

  /* ------------------------------------------------- module instantiation */
  VB._factories.sort((a, b) => a.order - b.order);
  for (const f of VB._factories) {
    try {
      VB.mods[f.name] = f.factory(VB, THREE) || {};
    } catch (e) {
      console.error('[module ' + f.name + ' construct]', e);
      VB.mods[f.name] = {};
    }
  }
  const list = VB._factories.map(f => VB.mods[f.name]);
  const call = (fn, ...a) => {
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      if (m && typeof m[fn] === 'function') {
        try { m[fn](...a); } catch (e) { console.error('[' + VB._factories[i].name + '.' + fn + ']', e); }
      }
    }
  };
  call('init');

  /* -------------------------------------------------------------- layout */
  function layoutScreen() {
    const W = window.innerWidth, H = window.innerHeight;
    /* Pillarbox / letterbox to a hard 4:3 window. */
    let w = W, h = W / cfg.aspect;
    if (h > H) { h = H; w = H * cfg.aspect; }
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
    canvas.style.left = Math.round((W - w) / 2) + 'px';
    canvas.style.top = Math.round((H - h) / 2) + 'px';
    call('resize', cfg.sceneW, cfg.sceneH);
  }
  window.addEventListener('resize', layoutScreen);
  layoutScreen();

  /* ------------------------------------------------------------ director */
  /* Owns S.dread / S.wear / S.burst / S.dropout — the slow build of the tape
     falling apart and the room getting less friendly. */
  let nextBurst = 6 + Math.random() * 14;
  let nextDrop = 3 + Math.random() * 9;
  const director = {
    update(dt) {
      /* Tape wear: monotonic, asymptotic. Reaches ~0.5 at 6 min, ~0.8 at 20. */
      S.wear = 1 - Math.exp(-S.t / 520) * (1 - 0.02);
      S.wear = VB.clamp(S.wear + S.prox * 0.10, 0, 1);

      /* Dread: slow base ramp, pushed hard by entity proximity/sighting. */
      const base = VB.smoothstep(0, 300, S.t) * 0.55;
      const target = VB.clamp(base + S.prox * 0.55 + S.seen * 0.35 + S.stalked * 0.25, 0, 1);
      S.dread = VB.approach(S.dread, target, target > S.dread ? 1.6 : 0.22, dt);

      /* Static bursts — more frequent as the tape wears and dread climbs. */
      nextBurst -= dt * (0.55 + S.wear * 1.9 + S.dread * 1.3);
      if (nextBurst <= 0) {
        nextBurst = 5 + Math.random() * 16;
        VB.emit('glitch:burst', { amt: 0.35 + Math.random() * 0.65 * (0.4 + S.wear) });
      }
      S.burst = Math.max(0, S.burst - dt * 3.4);

      /* Dropouts — the short white/black streaks of shed oxide. */
      nextDrop -= dt * (0.7 + S.wear * 3.2);
      if (nextDrop <= 0) { nextDrop = 1.6 + Math.random() * 7; S.dropout = 0.4 + Math.random() * 0.6; }
      S.dropout = Math.max(0, S.dropout - dt * 5.5);

      S.roomPulse = Math.max(0, S.roomPulse - dt * 1.25);
    },
  };
  VB.on('glitch:burst', e => { S.burst = Math.max(S.burst, e && e.amt != null ? e.amt : 0.6); });
  VB.on('room:enter', () => { S.roomPulse = Math.min(1, S.roomPulse + 0.75); });

  /* ----------------------------------------------------------- the clock */
  const FIELD_DT = 1 / 59.94;
  const MAX_STEPS = 3;
  let acc = 0, last = performance.now() / 1000;
  let field = 0;                 // 0 = upper field, 1 = lower field
  VB.field = 0;
  VB.running = false;
  VB.deterministic = false;      // harness sets true for reproducible frames

  function stepSim(dt) {
    S.dt = dt; S.t += dt; S.frame++;
    director.update(dt);
    call('update', dt);
    call('lateUpdate', dt);
  }

  /* Renders the scene into postfx's CCD buffer for the current field, then —
     on the lower field — weaves + presents the finished frame. */
  function renderField() {
    VB.field = field;
    const px = VB.mods.postfx;
    if (px && px.renderField) px.renderField(scene, camera, field);
    else renderer.render(scene, camera);
    if (field === 1 && px && px.present) px.present();
    field ^= 1;
  }

  function frame(nowMs) {
    if (!VB.deterministic) {
      const now = nowMs / 1000;
      let wall = now - last; last = now;
      if (wall > 0.25) wall = 0.25;
      acc += wall;
      let steps = 0;
      while (acc >= FIELD_DT && steps < MAX_STEPS) {
        acc -= FIELD_DT; steps++;
        if (VB.running) stepSim(FIELD_DT);
        renderField();
      }
      if (steps === 0 && VB.mods.postfx && VB.mods.postfx.repaint) VB.mods.postfx.repaint();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ------------------------------------------------------------ start-up */
  /* Audio + pointer lock both require a gesture. The "press play" plate is
     itself diegetic: a paused VCR. */
  function start() {
    if (VB.running) return;
    VB.running = true;
    call('start');
    VB.emit('game:start');
  }
  VB.start = start;

  /* -------------------------------------------------------- harness hook */
  window.__VB = {
    VB, S, cfg,
    ready: true,
    /* Advance exactly n fields of fixed dt with the wall clock ignored, so a
       screenshot at step N is bit-identical run to run (given a fixed seed). */
    step(n = 1) {
      VB.deterministic = true;
      if (!VB.running) { VB.running = true; call('start'); VB.emit('game:start'); }
      for (let i = 0; i < n; i++) { stepSim(FIELD_DT); renderField(); }
    },
    /* Jump the clock without rendering — lets a critic see minute-20 tape wear
       without waiting for 70000 software-rasterised fields. */
    warp(seconds) {
      S.t += seconds;
      director.update(1 / 60);
      for (let i = 0; i < 30; i++) director.update(0.2);
    },
    seed(v) { S.seed = v >>> 0; VB.emit('world:reseed', v >>> 0); },
    set(k, v) { S[k] = v; },
    teleport(x, z, yaw) {
      S.pos.set(x, cfg.eyeHeight, z);
      if (yaw != null) S.yaw = yaw;
      VB.emit('player:teleport');
    },
    modules() { return VB._factories.map(f => f.name); },
  };
  window.VB = VB;
  console.log('[vb] booted modules:', VB._factories.map(f => f.name).join(', '));
})();

</script>

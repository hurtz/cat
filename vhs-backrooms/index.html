        lr(P.hndGain.gain, 0.0085 * (st.turn * 1.5 + st.move * 0.55 + d * 0.15), when + rmp);

        /* tape degradation */
        lr(P.hissGain.gain, 0.011 + w * 0.040 + st.burst * 0.045 + px * 0.010, when + rmp);
        const lpF = 7400 - w * 3150 - px * 700 - st.burst * 900;
        lr(P.lp1.frequency, lpF, when + rmp);
        lr(P.lp2.frequency, lpF, when + rmp);
        lr(P.lp3.frequency, lpF, when + rmp);
        lr(P.lp4.frequency, lpF, when + rmp);
        lr(P.hsLP1.frequency, lpF * 1.04, when + rmp);
        lr(P.hsLP2.frequency, lpF * 1.04, when + rmp);
        lr(P.hsLP3.frequency, lpF * 1.04, when + rmp);
        const hpF = 76 + w * 44;
        lr(P.hp1.frequency, hpF, when + rmp);
        lr(P.hp2.frequency, hpF * 1.21, when + rmp);

        /* wow & flutter get worse as the pack deforms */
        lr(P.wowG.gain, 0.00205 * (1 + w * 2.3), when + rmp);
        lr(P.wow2G.gain, 0.00054 * (1 + w * 2.8), when + rmp);
        lr(P.flutG.gain, 0.000030 * (1 + w * 3.6 + d * 0.6), when + rmp);
        lr(P.driftG.gain, 0.0016 * (1 + w * 2.2), when + rmp);

        /* and the coating saturates more easily */
        const pre = 1 + w * 1.55 + d * 0.35;
        lr(P.satPre.gain, pre, when + rmp);
        lr(P.satPost.gain, 1 / (1 + w * 0.85 + d * 0.22), when + rmp);

        lr(P.revOut.gain, 0.34 + st.roomPulse * 0.10 + d * 0.05, when + rmp);
      },

      /* ---- autonomous behaviour ---- */
      advance(dt, when, st) {
        const w = clamp(st.wear, 0, 1), d = clamp(st.dread, 0, 1);
        const px = clamp(st.prox, 0, 1), stk = clamp(st.stalked, 0, 1);

        /* -------------------------------- FOOTSTEPS THAT ARE NOT YOURS --- */
        const moving = st.move > 0.16;
        far.still = moving ? 0 : far.still + dt;
        far.cool -= dt;

        if (!far.on && far.cool <= 0 && moving) {
          const urge = 0.035 + d * 0.10 + stk * 0.20 + px * 0.30;
          if (R() < urge * dt * 3.0) startFar(st);
        }

        if (far.on) {
          /* THE RULE: they stop when you stop. Most of the time there is one
             more footfall after yours — the beat that makes people take their
             headphones off. */
          if (far.still > 0.30 && !far.halted) {
            far.halted = true;
            if (R() < 0.58) { far.left = 1; far.timer = far.iv * (0.8 + R() * 0.55); }
            else { far.left = 0; }
          }
          if (far.still <= 0.30 && far.halted && far.left > 0) far.halted = false;

          if (far.left <= 0) {
            far.on = false;
            far.cool = 6 + R() * 26 - d * 4 - px * 4;
          } else {
            far.timer -= dt;
            if (far.timer <= 0) {
              fire(rig, 'farStep', when, { near: far.near });
              far.left--;
              far.iv = clamp(far.iv + far.drift + (R() - 0.5) * 0.02, 0.30, 0.95);
              far.timer = far.iv;
              /* a limp: every so often the second foot lands too soon */
              if (R() < 0.10) fire(rig, 'farStep', when + far.iv * (0.30 + R() * 0.2), { near: far.near * 0.8 });
              /* and sometimes it simply stops mid-stride, for no reason */
              if (R() < 0.035 + px * 0.05) { far.left = 0; }
              /* closing in */
              far.near = clamp(far.near + (px * 0.05 - 0.004) * (1 + d), 0, 1);
            }
          }
        }

        /* ------------------------------------------------------ VOICES --- */
        voiceCool -= dt * (0.6 + d * 1.4 + stk * 1.0 + px * 1.6);
        if (voiceCool <= 0) {
          voiceCool = 30 + R() * 70;
          const near = clamp(0.05 + px * 0.55 + stk * 0.2 + R() * 0.22, 0, 1);
          fire(rig, 'voice', when, { near, dur: 0.7 + R() * 2.2 });
          /* two of them, sometimes, answering each other */
          if (R() < 0.22) fire(rig, 'voice', when + 1.0 + R() * 1.6, { near: near * 0.8, dur: 0.5 + R() * 1.2 });
        }

        /* ------------------------------------------- TAPE HOUSEKEEPING --- */
        thumpCool -= dt * (0.45 + w * 1.8);
        if (thumpCool <= 0) { thumpCool = 16 + R() * 46; fire(rig, 'thump', when, { amt: 0.35 + R() * 0.65 }); }

        dropCool -= dt * (0.5 + w * 3.4 + d * 0.5);
        if (dropCool <= 0) {
          dropCool = 1.1 + R() * 5.5;
          fire(rig, 'dropout', when, { deep: R() < 0.14 + w * 0.34 });
        }

        jumpCool -= dt * (0.3 + w * 2.2);
        if (jumpCool <= 0) { jumpCool = 12 + R() * 34; fire(rig, 'jump', when, {}); }

        if (flickCool > 0) flickCool -= dt;
      },

      /* rate-limit for light:flicker, which the lighting module fires often */
      wantFlicker(dt) {
        if (flickCool > 0) return false;
        flickCool = 0.42 + R() * 0.9;
        return true;
      },
    };
  }

  /* ======================================================== OFFLINE SIM ====
     A plausible twelve seconds of someone walking down a corridor: they walk,
     they stop, they walk again; they pass under fixtures so the ballast buzz
     swells and fades; the tape wears. Everything the live game feeds the
     director, this feeds the director. */
  function makeSim(ov, seed) {
    const R = VB.rngFrom(seed >>> 0);
    let moving = 1, moveT = 2.6 + R() * 2.0, move = 0;
    let dist = 0, stepPhase = 0, lastFoot = 0;
    let burst = 0, roomPulse = 0, turn = 0, turnT = 1.5;
    const get = (k, def) => (ov && ov[k] != null ? +ov[k] : def);

    return function (t, dt) {
      /* walk / pause cycle — the distant footsteps' stop-when-you-stop rule
         is only observable if the walker actually stops */
      moveT -= dt;
      if (moveT <= 0) {
        moving = moving ? 0 : 1;
        moveT = moving ? 2.4 + R() * 3.2 : 1.3 + R() * 1.9;
      }
      move = move + ((moving ? 1 : 0) - move) * (1 - Math.exp(-(moving ? 5 : 4.2) * dt));
      const spd = move * 2.35;
      dist += spd * dt;

      /* fixtures every two cells: buzz swells under each one */
      const b = 0.5 + 0.5 * Math.cos(dist * TAU / 5.2);
      const buzz = clamp(0.18 + 0.82 * b * (0.72 + 0.28 * VB.vnoise1(dist * 0.19, 91)), 0, 1);

      /* the operator looks around */
      turnT -= dt;
      if (turnT <= 0) { turnT = 0.8 + R() * 2.4; turn = R() < 0.45 ? 0.3 + R() * 0.6 : 0; }
      turn = turn * Math.exp(-2.4 * dt);

      burst = Math.max(0, burst - dt * 3.4);
      roomPulse = Math.max(0, roomPulse - dt * 1.25);

      stepPhase += spd * dt * 2.702;
      const foot = Math.floor(stepPhase / Math.PI);
      const stepped = foot !== lastFoot && move > 0.2;
      if (stepped) lastFoot = foot;

      return {
        t, move, running: 0, turn,
        wear: get('wear', clamp(0.06 + t * 0.004, 0, 1)),
        dread: get('dread', 0.28),
        prox: get('prox', 0),
        seen: get('seen', 0),
        stalked: get('stalked', get('prox', 0) * 0.6),
        anomaly: get('anomaly', 0.2),
        buzz: get('buzz', buzz),
        burst, roomPulse,
        _step: stepped, _foot: foot & 1, _spd: spd,
        _bump(v) { burst = Math.max(burst, v); },
        _pulse() { roomPulse = 1; },
      };
    };
  }

  /* ================================================================ LIVE ==== */
  let live = null;          // {ctx, rig, dir}
  let lastTick = -1;
  let lastStepAt = -1;

  function nowAt() { return live ? live.ctx.currentTime : 0; }
  function alive() { return !!(live && live.ctx && live.ctx.state !== 'closed'); }
  function running() { return !!(live && live.ctx && live.ctx.state === 'running'); }

  function liveState() {
    const buzz = (VB.lighting && VB.lighting.buzzAt)
      ? VB.lighting.buzzAt(S.pos ? S.pos.x : 0, S.pos ? S.pos.z : 0) : 0.6;
    return {
      t: S.t, move: S.move, running: S.running, turn: S.turn,
      wear: S.wear, dread: S.dread, prox: S.prox, seen: S.seen, stalked: S.stalked,
      anomaly: S.anomaly, buzz: buzz, burst: S.burst, roomPulse: S.roomPulse,
    };
  }

  function startLive() {
    if (live) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    let ctx;
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { return; }
    const seed = (S.seed ^ 0x1987BEEF) >>> 0;
    const rig = buildGraph(ctx, seed);
    const dir = makeDirector(rig, (seed ^ 0x9E3779B9) >>> 0);
    rig.start(ctx.currentTime + 0.03);
    live = { ctx, rig, dir };
    lastTick = ctx.currentTime;
    VB.audio.ctx = ctx;
    VB.audio.master = rig.master;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(function () { });
  }

  /* =============================================================== MODULE ==== */
  return {
    init() {
      VB.audio = {
        ctx: null,
        master: null,
        unlock() {
          startLive();
          if (live && live.ctx.state === 'suspended' && live.ctx.resume) {
            live.ctx.resume().catch(function () { });
          }
        },
        sfx(name, opts) {
          if (!running()) return;
          const o = opts || {};
          const t = o.when != null ? o.when : live.ctx.currentTime + 0.012;
          fire(live.rig, name, t, o);
        },
        renderOffline,
        get state() { return live ? live.ctx.state : 'none'; },
      };

      /* ------------------------------------------------------ event wiring */
      VB.on('player:step', (e) => {
        if (!running()) return;
        const t = live.ctx.currentTime;
        if (t - lastStepAt < 0.07) return;
        lastStepAt = t;
        fire(live.rig, 'step', t + 0.010, { foot: e && e.foot, speed: e && e.speed });
      });

      VB.on('glitch:burst', (e) => {
        if (!running()) return;
        fire(live.rig, 'glitch', live.ctx.currentTime + 0.006, { amt: e && e.amt != null ? e.amt : 0.6 });
      });

      VB.on('light:flicker', (e) => {
        if (!running() || !live.dir.wantFlicker()) return;
        fire(live.rig, 'flicker', live.ctx.currentTime + 0.010, { amt: e && e.amt != null ? e.amt : 0.6 });
      });

      VB.on('room:enter', () => {
        if (!running()) return;
        fire(live.rig, 'roomEnter', live.ctx.currentTime + 0.010, {});
      });

      VB.on('player:interact', (e) => {
        if (!running()) return;
        fire(live.rig, 'knock', live.ctx.currentTime + 0.010, { hit: e && e.hit });
      });

      VB.on('entity:sighting', (e) => {
        if (!running()) return;
        const s = e && e.strength != null ? e.strength : 0.7;
        fire(live.rig, 'sighting', live.ctx.currentTime + 0.010, { strength: s });
        fire(live.rig, 'glitch', live.ctx.currentTime + 0.012, { amt: 0.35 + s * 0.5 });
      });

      VB.on('entity:near', (e) => {
        if (!running()) return;
        /* it is close enough to hear properly: force a short burst of steps */
        const dir = live.dir;
        if (!dir.far.on) {
          dir.far.on = true; dir.far.halted = false;
          dir.far.left = 2 + ((Math.random() * 4) | 0);
          dir.far.iv = 0.38 + Math.random() * 0.14;
          dir.far.near = 0.55 + Math.random() * 0.4;
          dir.far.timer = 0.05;
        }
      });

      VB.on('entity:spawn', () => { if (running()) fire(live.rig, 'thump', live.ctx.currentTime + 0.01, { amt: 0.45 }); });
    },

    /* Audio must not exist before a gesture — this is the gesture. */
    start() { startLive(); },

    update(dt) {
      if (!alive()) return;
      const ctx = live.ctx;
      const t = ctx.currentTime;
      /* A suspended context has a frozen clock; scheduling into it just piles
         up events at time 0. Only advance when the clock actually moves. */
      if (!(t > lastTick)) return;
      const adt = Math.min(0.25, t - lastTick);
      lastTick = t;
      const st = liveState();
      live.dir.tick(adt, t, st);
      live.dir.advance(adt, t + 0.02, st);
    },
  };

  /* ========================================================= RENDEROFFLINE ==
     Rebuilds the identical graph inside an OfflineAudioContext (mono, 44100),
     drives it with the same director over a simulated walk, and resolves the
     raw samples. This is the only window anyone in this loop has onto the
     sound, so it renders the real thing — bed plus a scattering of real
     events — not a test tone. */
  function renderOffline(seconds, stateOverrides) {
    seconds = Math.max(0.5, Math.min(180, +seconds || 10));
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OC) return Promise.reject(new Error('no OfflineAudioContext'));
    const SEED = 0x1987A0D0;
    const octx = new OC(1, Math.ceil(seconds * 44100), 44100);
    const rig = buildGraph(octx, SEED);
    const dir = makeDirector(rig, (SEED ^ 0x9E3779B9) >>> 0);
    const sim = makeSim(stateOverrides || {}, (SEED ^ 0x51ED) >>> 0);
    const R = VB.rngFrom((SEED ^ 0xC0FFEE) >>> 0);
    rig.start(0);

    /* Scripted beats as fractions of the render, so any duration shows the
       full vocabulary rather than whatever the random schedulers felt like. */
    const script = [
      [0.055, 'thump', { amt: 0.75 }],
      [0.140, 'farseq', { near: 0.30, n: 7, iv: 0.68 }],
      [0.300, 'flicker', { amt: 0.8 }],
      [0.330, 'glitch', { amt: 0.55 }],
      [0.400, 'knock', { hit: 1.4 }],
      [0.470, 'voice', { near: 0.34, dur: 1.9 }],
      [0.560, 'roomEnter', {}],
      [0.620, 'farseq', { near: 0.55, n: 6, iv: 0.41 }],
      [0.720, 'glitch', { amt: 0.9 }],
      [0.780, 'dropout', { deep: true }],
      [0.840, 'sighting', { strength: 0.8 }],
      [0.900, 'voice', { near: 0.5, dur: 1.3 }],
      [0.955, 'thump', { amt: 0.5 }],
    ];
    let si = 0;

    const DT = 1 / 40;
    const N = Math.floor((seconds - 0.05) / DT);
    for (let i = 0; i < N; i++) {
      const t = i * DT;
      const st = sim(t, DT);
      if (st._step) fire(rig, 'step', t, { foot: st._foot, speed: st._spd });

      while (si < script.length && script[si][0] * seconds <= t) {
        const name = script[si][1], o = script[si][2];
        if (name === 'farseq') {
          /* a whole sequence, so the tempo relationship is visible */
          const n = o.n, iv = o.iv;
          for (let k = 0; k < n; k++) {
            const jitter = (R() - 0.5) * 0.03;
            fire(rig, 'farStep', t + k * iv + jitter, { near: o.near });
          }
        } else if (name === 'glitch') {
          st._bump(0.8);
          fire(rig, name, t, o);
        } else if (name === 'roomEnter') {
          st._pulse();
          fire(rig, name, t, o);
        } else {
          fire(rig, name, t, o);
        }
        si++;
      }

      dir.tick(DT, t, st);
      dir.advance(DT, t, st);
    }
    /* let the last events breathe out */
    return octx.startRendering().then((b) => b.getChannelData(0));
  }
}, 40);


/* ==== 60_postfx.js ====================================================== */
/* ============================================================================
   POSTFX — the tape.

   Structure (do not flatten these; each stage models a different physical
   thing and they must happen in this order):

     renderField()  scene -> rtField[field]           the CCD, twice per frame
     present()      weave two fields -> rtWeave       29.97fps interlaced frame
                    meter downsample -> rtMeter       what the AE circuit sees
                    optics pass      -> rtOptics      lens + sensor
                    chroma pre-pass  -> rtChroma      the 0.4MHz colour-under
                    tape pass        -> rtTape        Y/C, noise, tears, levels
                    display pass     -> canvas        scanlines, bloom, levels

   Signal-domain notes, because getting these wrong is what makes a fake:

   * The CCD buffers are SRGB8, so the GPU decodes to linear light on sample.
     The weave re-encodes ONCE via toSignal() and every stage after that
     operates on a gamma-encoded signal. NTSC luma is Y' of gamma-corrected
     primaries — the Y/C split, the noise distribution and the black lift are
     only right in that domain. Nothing downstream re-encodes.

   * Everything that is constant over a frame (head-switch amount, tracking
     band position, exposure, gate weave, hue drift) is computed in JS in
     `sig()` and handed to the shaders as uniforms. Per-pixel work is spent
     only on things that actually vary per pixel.

   * Vertical resampling is quantised to 2-pixel steps everywhere. 480 buffer
     rows are two interleaved 240-line fields; a sub-line vertical shift would
     bilinear-blend the two fields together and silently destroy the combing,
     which is the single most expensive thing to lose.
   ========================================================================== */
VB.def('postfx', function (VB, THREE) {
  const S = VB.S, cfg = VB.cfg;
  const R = VB.renderer;
  const clamp = VB.clamp;

  const quadGeo = new THREE.PlaneGeometry(2, 2);
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quadScene = new THREE.Scene();
  const quad = new THREE.Mesh(quadGeo, null);
  quadScene.add(quad);

  /* VHS chroma is ~0.4MHz against ~3MHz luma. Carrying it in a buffer 1/8 the
     width is not an optimisation, it *is* the bandwidth model — the 8-pixel
     box on the way in and the bilinear spread on the way out are the filter. */
  const CDIV = 8;
  /* Auto-exposure metering grid. Coarse on purpose: a 1987 AE circuit is a
     photodiode behind a centre-weighted mask, not a histogram. */
  const MW = 128, MH = 4;

  function rt(w, h, depth) {
    return new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
      depthBuffer: !!depth, stencilBuffer: false,
    });
  }
  function ccd(w, h) {
    const r = rt(w, h, true);
    r.texture.colorSpace = THREE.SRGBColorSpace;
    return r;
  }

  let rtField = [], rtWeave, rtOptics, rtChroma, rtTape, rtMeter;
  let meterBuf = new Uint8Array(MW * MH * 4);

  const COMMON = `
    precision highp float;
    varying vec2 vUv;
    float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    /* smooth 1-D value noise — used for anything that must be correlated
       along a scanline instead of per-pixel */
    float vnx(float x, float s){
      float i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
      return mix(hash21(vec2(i, s)), hash21(vec2(i+1.0, s)), f);
    }
    /* NTSC Y'IQ. Columns are R, G, B. */
    const mat3 RGB2YIQ = mat3(0.299,0.596,0.211, 0.587,-0.274,-0.523, 0.114,-0.322,0.312);
    const mat3 YIQ2RGB = mat3(1.0,1.0,1.0, 0.956,-0.272,-1.106, 0.619,-0.647,1.703);
    /* The CCD targets are SRGB8, so the GPU hands us linear light on sample.
       Re-encode once, at the weave, and every stage downstream then operates on
       a gamma-encoded signal — which is what a composite chain actually carries. */
    vec3 toSignal(vec3 c){
      c = clamp(c, 0.0, 1.0);
      return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c));
    }
  `;
  const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`;

  /* ------------------------------------------------------------ weave
     Field 0 lands on even raster rows, field 1 on odd, and the two were
     simulated 1/59.94s apart. That temporal disagreement IS the combing;
     nothing downstream is allowed to average across the parity. */
  const weaveMat = new THREE.ShaderMaterial({
    uniforms: { tA: { value: null }, tB: { value: null }, res: { value: new THREE.Vector2() } },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tA, tB; uniform vec2 res;
      void main(){
        float line = floor(vUv.y * res.y);
        vec3 c = mod(line, 2.0) < 1.0 ? texture2D(tA, vUv).rgb : texture2D(tB, vUv).rgb;
        gl_FragColor = vec4(toSignal(c), 1.0);
      }`,
  });

  /* ------------------------------------------------------------- meter
     One coarse cell = 5 x 120 source pixels. rgb = mean (auto-exposure reads
     this back on the CPU), a = peak luma in the column slice (the optics pass
     turns that into CCD vertical smear). */
  const meterMat = new THREE.ShaderMaterial({
    uniforms: { tD: { value: null }, cell: { value: new THREE.Vector2(1 / MW, 1 / MH) } },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD; uniform vec2 cell;
      void main(){
        vec2 base = floor(vUv/cell);
        vec3 sum = vec3(0.0); float mx = 0.0;
        for(int j=0;j<8;j++){
          for(int i=0;i<4;i++){
            vec2 o = (vec2(float(i)/4.0, float(j)/8.0) + vec2(0.125, 0.0625));
            vec3 c = texture2D(tD, (base + o)*cell).rgb;
            sum += c;
            mx = max(mx, dot(c, vec3(0.299,0.587,0.114)));
          }
        }
        gl_FragColor = vec4(sum/32.0, mx);
      }`,
  });

  /* ----------------------------------------------------------- optics
     The camcorder in front of the tape: soft CCD, lateral CA, vignette, gate
     weave, sensor smear, and the auto-iris. Everything here is pre-recording.  */
  const opticsMat = new THREE.ShaderMaterial({
    uniforms: {
      tD: { value: null }, tMeter: { value: null }, res: { value: new THREE.Vector2() },
      wear: { value: 0 }, expo: { value: 1 }, gate: { value: new THREE.Vector2() },
      smear: { value: 0.055 },
    },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD, tMeter; uniform vec2 res, gate;
      uniform float wear, expo, smear;

      void main(){
        vec2 px = 1.0/res;
        /* gate weave — the whole image wanders. gate.y arrives already
           quantised to 2 rows so the field parity survives the resample. */
        vec2 uv = vUv + gate*px;
        vec2 d = uv - 0.5;
        float r2 = dot(d,d);

        /* lateral chromatic aberration: a radial scale error, zero at the
           optical axis, ~2px at the corners, worse as the tape ages (it isn't
           really the lens by then, but the eye reads it as one artifact) */
        float ca = (0.0075 + wear*0.0045) * r2;
        vec2 uvR = uv + d*ca, uvB = uv - d*ca;

        /* 1987 CCD + its optical low-pass: soft, and softer horizontally than
           vertically. Vertical taps are 2 rows out so they stay inside one
           field — blurring across parity would kill the combing. */
        vec3 c;
        c.r = 0.5*texture2D(tD, uvR).r + 0.25*texture2D(tD, uvR+vec2(px.x,0.0)).r + 0.25*texture2D(tD, uvR-vec2(px.x,0.0)).r;
        c.g = 0.5*texture2D(tD, uv ).g + 0.25*texture2D(tD, uv +vec2(px.x,0.0)).g + 0.25*texture2D(tD, uv -vec2(px.x,0.0)).g;
        c.b = 0.5*texture2D(tD, uvB).b + 0.25*texture2D(tD, uvB+vec2(px.x,0.0)).b + 0.25*texture2D(tD, uvB-vec2(px.x,0.0)).b;
        vec3 vv = texture2D(tD, uv+vec2(0.0, 2.0*px.y)).rgb + texture2D(tD, uv-vec2(0.0, 2.0*px.y)).rgb;
        c = mix(c, vv*0.5, 0.22);

        /* interline transfer smear: a bright source bleeds a soft column all
           the way up and down the sensor. Pure 1980s CCD. */
        float col = 0.0;
        for(int j=0;j<4;j++) col = max(col, texture2D(tMeter, vec2(uv.x, (float(j)+0.5)/4.0)).a);
        c += smear * smoothstep(0.72, 1.0, col);

        /* heavy vignette — cheap wide lens, wide open indoors */
        float vig = pow(clamp(1.0 - r2*0.95, 0.0, 1.0), 0.85);
        c *= vig;

        /* auto-iris. expo is driven on the CPU by a delayed, under-damped
           response to the meter, so it always arrives a beat late and
           overshoots before it settles. */
        c *= expo;

        /* sensor saturation: soft knee, then a hard ceiling */
        vec3 k = max(c - 0.78, 0.0);
        c = min(c, 0.78) + k/(1.0 + k*1.5);
        gl_FragColor = vec4(min(c, 1.18), 1.0);
      }`,
  });

  /* ----------------------------------------------------------- chroma
     The colour-under channel, carried at 1/CDIV the luma width. The 8-pixel
     box on the way in is the 0.4MHz brick wall; 'lag' is the group delay of
     the chroma filter, which is why colour arrives to the RIGHT of the luma
     edge it belongs to. Chroma noise is generated here so that it inherits
     the same smear and comes out coarse and blotchy instead of speckled. */
  const chromaMat = new THREE.ShaderMaterial({
    uniforms: {
      tD: { value: null }, res: { value: new THREE.Vector2() },
      cres: { value: new THREE.Vector2() }, sd: { value: new THREE.Vector4() },
      wear: { value: 0 }, lag: { value: 5.0 }, dread: { value: 0 }, frameN: { value: 0 },
    },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD; uniform vec2 res, cres; uniform vec4 sd;
      uniform float wear, lag, dread, frameN;
      void main(){
        vec2 uv = vUv;
        float sl = floor((1.0-uv.y)*res.y);
        float ipx = 1.0/res.x;
        /* four bilinear taps = an exact 8-pixel box, displaced left by 'lag' */
        vec3 a = texture2D(tD, uv + vec2((-3.0-lag)*ipx, 0.0)).rgb;
        vec3 b = texture2D(tD, uv + vec2((-1.0-lag)*ipx, 0.0)).rgb;
        vec3 c = texture2D(tD, uv + vec2(( 1.0-lag)*ipx, 0.0)).rgb;
        vec3 e = texture2D(tD, uv + vec2(( 3.0-lag)*ipx, 0.0)).rgb;
        vec3 yiq = RGB2YIQ * ((a+b+c+e)*0.25);
        vec2 iq = yiq.yz;

        /* colour-under phase error: the chroma subcarrier is re-heterodyned
           off a wobbly reference, so hue rotates a little line to line */
        float ph = (vnx(sl*0.31 + frameN*0.09, 11.0) - 0.5) * (0.10 + wear*0.55);
        float cs = cos(ph), sn = sin(ph);
        iq = mat2(cs, sn, -sn, cs) * iq;

        /* chroma noise: coarse blocks (2 chroma texels x 2 lines), biased hard
           onto the green/magenta axis, living in the darks and mids */
        /* Hard-edged blocks were the bug here: quantising x to 2-texel cells
           makes a square wave, and a square wave's harmonics (1/3, 1/5 of the
           period) land far above the colour-under band — which both measured
           as chroma bandwidth this filter is not supposed to pass, and read as
           digital mosaic rather than tape. Interpolating between cells keeps
           the coarse blotchy scale without the harmonics. Rows still quantise
           to line pairs, because chroma noise IS correlated down a scanline. */
        float ccx = uv.x*cres.x*0.5;
        float crow = floor(sl*0.5) + frameN;
        float n1 = vnx(ccx, crow) - 0.5;
        float n2 = vnx(ccx + 37.7, crow + 11.0) - 0.5;
        vec2 gm = vec2(0.464, 0.886);              /* magenta(+) / green(-) */
        float amp = (0.030 + wear*0.105 + dread*0.012);
        float wgt = (1.0 - 0.82*smoothstep(0.34, 0.92, yiq.x)) * (0.45 + 0.55*smoothstep(0.0, 0.10, yiq.x));
        iq += (gm*n1*1.15 + vec2(-gm.y, gm.x)*n2*0.42) * amp * wgt;

        gl_FragColor = vec4(0.5 + iq*0.8, 0.0, 1.0);
      }`,
  });

  /* ------------------------------------------------------------- tape
     Where the authenticity is won or lost. In order: work out where this
     scanline actually landed (time-base error, tracking band, head switch),
     sample luma through the VCR's band-limit + detail circuit, fetch the
     colour-under, add tape noise, burn in dropouts, then apply tape levels. */
  const tapeMat = new THREE.ShaderMaterial({
    uniforms: {
      tD: { value: null }, tHud: { value: null }, tChroma: { value: null },
      res: { value: new THREE.Vector2() },
      t: { value: 0 }, wear: { value: 0 }, burst: { value: 0 }, dread: { value: 0 },
      dropout: { value: 0 }, prox: { value: 0 }, frameN: { value: 0 },
      /* per-frame signal geometry, computed on the CPU */
      tbe: { value: new THREE.Vector3() },     /* x: per-line jitter, y: jelly, z: whole-frame */
      hs: { value: new THREE.Vector4() },      /* x: edge uv, y: shift, z: slope, w: noise */
      track: { value: new THREE.Vector3() },   /* x: centre, y: amount, z: noise gain */
      vshift: { value: 0 }, hue: { value: 0 }, sat: { value: 0.8 },
      ring: { value: 0.9 },
    },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD, tHud, tChroma; uniform vec2 res;
      uniform float t, wear, burst, dread, dropout, prox, frameN;
      uniform vec3 tbe, track; uniform vec4 hs;
      uniform float vshift, hue, sat, ring;

      /* the signal as it reaches the record head: picture with the character
         generator already burned into it (that is why the OSD wears out too) */
      float SIGY(vec2 uv){
        vec3 rgb = texture2D(tD, uv).rgb;
        vec4 h = texture2D(tHud, uv);
        rgb = mix(rgb, h.rgb, h.a);
        return dot(rgb, vec3(0.299, 0.587, 0.114));
      }

      void main(){
        vec2 uv = vUv;
        float sl = floor((1.0-uv.y)*res.y);        /* raster line, 0 at the top */
        float ipx = 1.0/res.x, ipy = 1.0/res.y;

        /* ---- 1. time-base error --------------------------------------- */
        /* per-line random displacement, sub-pixel on a good tape */
        float x = (hash21(vec2(sl, frameN)) - 0.5) * tbe.x;
        /* velocity error: smooth in line index and crawling in time, so
           vertical edges wobble like jelly instead of buzzing */
        x += (vnx(sl*0.055 + tbe.z*7.0, 3.0) - 0.5) * tbe.y;
        x += tbe.z;                                 /* whole frame breathes */

        /* ---- 2. tracking band ----------------------------------------- */
        float dy = abs(fract(uv.y - track.x + 0.5) - 0.5);
        float bandW = 1.0 - smoothstep(0.0, 0.090, dy);   /* displaced */
        float bandC = 1.0 - smoothstep(0.0, 0.024, dy);   /* pure noise core */
        float trk = bandW * track.y;
        x += trk * (0.010 + 0.030*hash21(vec2(sl, frameN + 3.0))) * (0.45 + bandC);

        /* ---- 3. head switching ---------------------------------------- */
        /* The head swaps mid-line at the bottom of every field, so the last
           few lines are displaced and full of off-track noise, and the
           boundary between good and torn signal runs slightly diagonally. */
        float edge = hs.x + (uv.x - 0.5)*hs.z + sin(uv.x*7.3 + t)*0.6*ipy;
        float hsv = 1.0 - smoothstep(edge - 3.0*ipy, edge, uv.y);
        float hsx = hsv*hsv;                        /* the classic bottom flag */
        x += hsx * hs.y * (0.55 + 0.75*hsx);
        x += hsx * (hash21(vec2(sl, frameN+9.0)) - 0.5) * 0.020;

        /* vertical: the torn lines are lifted off a different part of the
           track. Quantised to whole line pairs so the fields stay separate. */
        float vy = vshift + floor(hsx*hs.w*3.0 + 0.5)*2.0;
        vec2 o = vec2(x, vy*ipy);

        /* ---- 4. luma: band limit + the VCR detail circuit -------------- */
        /* Eight taps do triple duty: a 5-tap low-pass at the sample point, a
           wide low-pass 3.5px to the LEFT, and a one-sided smear tail. */
        float s_7 = SIGY(uv + o + vec2(-7.0*ipx, 0.0));
        float s_5 = SIGY(uv + o + vec2(-5.0*ipx, 0.0));
        float s_35= SIGY(uv + o + vec2(-3.5*ipx, 0.0));
        float s_2 = SIGY(uv + o + vec2(-2.0*ipx, 0.0));
        float s_1 = SIGY(uv + o + vec2(-1.0*ipx, 0.0));
        float s0  = SIGY(uv + o);
        float s1  = SIGY(uv + o + vec2( 1.0*ipx, 0.0));
        float s2  = SIGY(uv + o + vec2( 2.0*ipx, 0.0));

        float y  = 0.13*s_2 + 0.22*s_1 + 0.30*s0 + 0.22*s1 + 0.13*s2;
        float yd = 0.30*s_2 + 0.40*s_35 + 0.30*s_5;   /* delayed by ~3.5px */

        /* Overshoot: out = y + k*(y - y_delayed). On a dark->light edge the
           delayed term is still dark, so the pixels immediately to the RIGHT
           of the transition ring bright; on light->dark they undershoot.
           Cored so it sharpens picture detail and not tape noise, and limited
           the way a real peaking circuit limits. */
        float dv = y - yd;
        dv = sign(dv) * max(abs(dv) - 0.010, 0.0);
        y += clamp(dv * ring, -0.30, 0.34);

        /* trailing smear: bright things drag a short comet tail rightwards */
        float tail = max(s_35-0.55,0.0)*0.30 + max(s_5-0.55,0.0)*0.20 + max(s_7-0.55,0.0)*0.11;
        y += tail * (0.55 + wear*0.5);

        /* ---- 5. chroma ------------------------------------------------- */
        float cpx = float(${CDIV})*ipx;
        vec2 cuv = uv + o;
        vec3 c0 = texture2D(tChroma, cuv).rgb;
        vec3 cl = texture2D(tChroma, cuv - vec2(cpx, 0.0)).rgb;
        vec3 cr = texture2D(tChroma, cuv + vec2(cpx, 0.0)).rgb;
        vec2 iq = ((c0.rg*0.5 + cl.rg*0.28 + cr.rg*0.22) - 0.5)/0.8;

        /* ---- 6. tape noise --------------------------------------------- */
        /* horizontally correlated: streaks along the line, independent per
           line. Never per-pixel snow — that reads as digital, not as tape. */
        float nx = uv.x*res.x;
        float ns = (vnx(nx*0.17, sl + frameN*3.0) - 0.5)*0.85
                 + (vnx(nx*0.42, sl + frameN*3.0 + 91.0) - 0.5)*0.45;
        float nAmp = 0.022 + wear*0.070 + dread*0.020 + prox*0.030;
        y += ns * nAmp * (0.72 + 0.75*(1.0 - clamp(y,0.0,1.0)));

        /* ---- 7. tracking + head-switch noise fill ---------------------- */
        float bandNoise = hash21(vec2(nx*0.5, sl + frameN*17.0));
        float fill = clamp(bandC*track.y*track.z, 0.0, 1.0);
        y = mix(y, 0.28 + bandNoise*0.55, fill*0.85);
        iq *= (1.0 - fill*0.9);

        float hsn = hsx * (0.45 + wear*0.45);
        y = mix(y, 0.20 + hash21(vec2(nx, sl + frameN*29.0))*0.72, hsn);
        iq *= (1.0 - hsx*0.95);                     /* no burst = no colour */

        /* ---- 8. dropouts ----------------------------------------------- */
        /* shed oxide: a short bright dash, sometimes two lines tall */
        float dl = hash21(vec2(floor(sl*0.5), frameN*1.7));
        /* A real tape does not shed oxide five times a frame. At rest this is
           well under one dropout per frame; the dropout event only lifts it to
           a couple. Frequency is the whole difference between "damaged tape"
           and "decorative white dashes". */
        float thr = 0.9992 - dropout*0.0125 - wear*0.0040;
        if (dl > thr){
          float cxr = hash21(vec2(floor(sl*0.5), frameN*1.7 + 5.0));
          /* squared so short dashes dominate and long ones are rare */
          float wr = hash21(vec2(floor(sl*0.5), frameN*1.7 + 13.0));
          float wdt = 0.006 + 0.075*wr*wr;
          float d = 1.0 - smoothstep(wdt*0.42, wdt*0.5, abs(uv.x - cxr));
          /* most are the classic bright dash, but a minority drop to black —
             which is what actually happens when the head loses RF entirely */
          float dark = step(0.78, hash21(vec2(floor(sl*0.5), frameN*1.7 + 29.0)));
          y = mix(y, mix(1.06, 0.04, dark), d);
          iq *= (1.0 - d);
        }

        /* ---- 9. static burst ------------------------------------------- */
        if (burst > 0.001){
          float sb = hash21(vec2(floor(nx*0.4), sl + floor(t*400.0)));
          float m = step(1.0 - burst*0.75, hash21(vec2(sl, floor(t*80.0))));
          y = mix(y, sb, m*burst*0.9);
          iq = mix(iq, (vec2(sb, 1.0-sb)-0.5)*0.5, m*burst*0.85);
        }

        /* ---- 10. tape levels -------------------------------------------- */
        /* slow hue drift + the colour dying towards grey-green with age */
        float hc = cos(hue), hsn2 = sin(hue);
        iq = mat2(hc, hsn2, -hsn2, hc) * iq;
        iq *= sat;
        iq += vec2(0.012, -0.011) * (0.6 + 0.4*wear);          /* warm cast */
        iq += vec2(-0.274, -0.523) * wear * 0.030;             /* green wash */

        y = min(y, 1.02);
        vec3 rgb = YIQ2RGB * vec3(y, iq);
        rgb = max(rgb, -0.05);
        /* blacks never reach zero on tape — they sit on a milky pedestal */
        rgb = rgb*(0.955 - wear*0.075) + vec3(0.044, 0.049, 0.046) + wear*0.030;
        gl_FragColor = vec4(rgb, 1.0);
      }`,
  });

  /* ---------------------------------------------------------- display
     The monitor this was played back on, and the capture of it. */
  const dispMat = new THREE.ShaderMaterial({
    uniforms: {
      tD: { value: null }, res: { value: new THREE.Vector2() },
      wear: { value: 0 }, phase: { value: 0 },
    },
    vertexShader: VERT,
    fragmentShader: COMMON + `
      uniform sampler2D tD; uniform vec2 res; uniform float wear, phase;
      void main(){
        vec2 uv = vUv;
        vec3 c = texture2D(tD, uv).rgb;

        /* bloom smears horizontally far more than vertically — the video
           amplifier has no idea what a scanline above it is doing */
        vec3 bl = vec3(0.0);
        for(int k=1;k<=4;k++){
          float d = float(k)*2.5/res.x;
          bl += texture2D(tD, uv+vec2(d,0.0)).rgb + texture2D(tD, uv-vec2(d,0.0)).rgb;
        }
        bl *= 0.125;
        c += max(bl - 0.60, 0.0) * 0.95;
        /* a little vertical halation, kept inside one field */
        vec3 vb = texture2D(tD, uv+vec2(0.0, 2.0/res.y)).rgb + texture2D(tD, uv-vec2(0.0, 2.0/res.y)).rgb;
        c += max(vb*0.5 - 0.74, 0.0) * 0.35;

        /* ~240 visible scanlines. The dark rows swap parity every frame,
           exactly as the two fields alternate on a real interlaced display. */
        float row = mod(floor(uv.y*res.y) + phase, 2.0);
        c *= mix(1.045, 0.855 - wear*0.03, row);

        c = clamp(c, 0.004, 1.0);
        gl_FragColor = vec4(c, 1.0);
      }`,
  });

  function blit(mat, target) {
    quad.material = mat;
    R.setRenderTarget(target || null);
    R.render(quadScene, quadCam);
  }

  /* ======================================================================
     The CPU-side signal model. Everything frame-constant lives here.
     ====================================================================== */
  const AE_DELAY = 7;                     /* ~0.23s of pure lag before the iris moves */
  const M = {
    frameN: 0,
    measured: 0.38, meterAge: 99,
    expo: 1, expoV: 0, aeQ: new Float32Array(AE_DELAY), aeI: 0, aePrimed: false,
    trackY: 0.63, trackAmt: 0,
    hsAmt: 0.02, hsLines: 7, hsSlope: 0,
    hue: 0, vshift: 0, drift: 0,
  };
  for (let i = 0; i < AE_DELAY; i++) M.aeQ[i] = 0.38;

  const AE_SET = 0.455;                   /* what the meter is aiming for */
  const V2 = new THREE.Vector2(), V3 = new THREE.Vector3(), V4 = new THREE.Vector4();

  function meter() {
    meterMat.uniforms.tD.value = rtWeave.texture;
    blit(meterMat, rtMeter);
    try {
      R.readRenderTargetPixels(rtMeter, 0, 0, MW, MH, meterBuf);
      let sum = 0, wsum = 0;
      for (let yy = 0; yy < MH; yy++) {
        const dy = (yy + 0.5) / MH - 0.5;
        for (let xx = 0; xx < MW; xx++) {
          const i = (yy * MW + xx) * 4;
          const l = (meterBuf[i] * 0.299 + meterBuf[i + 1] * 0.587 + meterBuf[i + 2] * 0.114) / 255;
          const dx = (xx + 0.5) / MW - 0.5;
          /* centre-weighted average metering, like every camcorder ever */
          const w = 1 / (1 + 7 * (dx * dx + dy * dy));
          sum += l * w; wsum += w;
        }
      }
      M.measured = sum / wsum;
      M.meterAge = 0;
    } catch (e) {
      /* readback unavailable — hold the last measurement rather than throw */
      M.meterAge = 99;
    }
  }

  /* Auto-exposure: a delayed, under-damped second-order response. It cannot
     be right on time and it cannot arrive without overshooting, which is
     exactly how a 1987 auto-iris behaves when you walk into a lit room. */
  function updateExposure(dt) {
    M.aeQ[M.aeI] = M.measured;
    M.aeI = (M.aeI + 1) % AE_DELAY;
    const lagged = M.aeQ[M.aeI];                  /* AE_DELAY frames old */
    const target = clamp(AE_SET / Math.max(lagged, 0.04), 0.62, 1.85);
    if (!M.aePrimed) { M.expo = target; M.aePrimed = true; }
    /* w0 ~ 5.8 rad/s, zeta ~ 0.42 -> visible overshoot, settles in ~1.5s */
    M.expoV += ((target - M.expo) * 34.0 - M.expoV * 4.9) * dt;
    M.expo = clamp(M.expo + M.expoV * dt, 0.35, 2.3);
  }

  function sig(dt) {
    const t = S.t, wear = S.wear;
    M.frameN = (M.frameN + 1) % 8192;
    const fN = M.frameN;

    updateExposure(dt);

    /* gate weave: the whole picture wanders a couple of pixels */
    const gx = (VB.fbm1(t * 0.53, 3, 91) - 0.47) * 3.0;
    let gy = (VB.fbm1(t * 0.37, 3, 57) - 0.47) * 2.6;
    gy = Math.round(gy * 0.5) * 2;                 /* keep the field parity */
    opticsMat.uniforms.gate.value.set(gx, gy);

    /* tracking band: crawls upward, spikes on fast pans, room entry and wear */
    const want = clamp(S.turn * 0.55 + S.roomPulse * 0.85 + wear * 0.30
      + S.burst * 0.45 + S.dread * 0.12 + S.prox * 0.20, 0, 1.25);
    M.trackAmt = VB.approach(M.trackAmt, want, want > M.trackAmt ? 9 : 1.1, dt);
    M.trackY -= dt * (0.055 + 0.16 * M.trackAmt + wear * 0.03);
    if (M.trackY < 0) M.trackY += 1;

    /* head switching: on every frame, always. Amount rattles frame to frame
       and gets openly unstable as the tape wears. */
    const hr = VB.hashf(fN, 7, 13), hr2 = VB.hashf(fN, 23, 91);
    const unstable = hr2 > (0.985 - wear * 0.10) ? 1 : 0;
    M.hsLines = 6.5 + wear * 3.5 + unstable * 4;
    M.hsAmt = (0.0125 + wear * 0.028) * (0.55 + 0.85 * hr) * (1 + unstable * 1.4);
    M.hsSlope = (2.4 + wear * 2.0 + unstable * 3.0) / cfg.sceneH;

    /* vertical hold wander — a couple of lines, and only when the tape is bad */
    const vs = (VB.vnoise1(t * 1.6, 21) - 0.5) * (wear * 3.4 + S.burst * 7.0);
    M.vshift = Math.round(vs * 0.5) * 2;

    /* hue drift: slow, never quite settling */
    M.hue = (VB.fbm1(t * 0.055, 3, 5) - 0.47) * 0.55 + Math.sin(t * 0.021) * 0.10;
    M.drift = VB.fbm1(t * 0.23, 3, 77) - 0.47;

    /* ---- push everything at the shaders ---- */
    const uo = opticsMat.uniforms;
    uo.tD.value = rtWeave.texture;
    uo.tMeter.value = rtMeter.texture;
    uo.wear.value = wear;
    uo.expo.value = M.expo;
    uo.smear.value = 0.05 + wear * 0.02;

    const uc = chromaMat.uniforms;
    uc.tD.value = rtOptics.texture;
    uc.frameN.value = fN;
    uc.wear.value = wear;
    uc.dread.value = S.dread;
    uc.lag.value = 4.5 + wear * 2.5;

    const u = tapeMat.uniforms;
    u.tD.value = rtOptics.texture;
    u.tChroma.value = rtChroma.texture;
    u.tHud.value = VB.hud ? VB.hud.texture : null;
    u.t.value = t; u.wear.value = wear; u.burst.value = S.burst;
    u.dread.value = S.dread; u.dropout.value = S.dropout; u.prox.value = S.prox;
    u.frameN.value = fN;
    u.tbe.value.set(
      (0.0011 + wear * 0.0034),                    /* per-line jitter */
      (0.0009 + wear * 0.0026 + S.turn * 0.0012),  /* jelly */
      M.drift * (0.0016 + wear * 0.0030));         /* whole-frame drift */
    u.hs.value.set(M.hsLines / cfg.sceneH, M.hsAmt, M.hsSlope, 1.0 + wear);
    u.track.value.set(M.trackY, M.trackAmt, 0.55 + wear * 0.55);
    u.vshift.value = M.vshift;
    u.hue.value = M.hue;
    u.sat.value = clamp(1.22 - wear * 0.44, 0.30, 1.35);
    u.ring.value = 0.95 + wear * 0.25;

    const ud = dispMat.uniforms;
    ud.tD.value = rtTape.texture;
    ud.wear.value = wear;
    ud.phase.value = fN % 2;
  }

  function alloc(w, h) {
    for (const r of rtField) r && r.dispose();
    for (const r of [rtWeave, rtOptics, rtChroma, rtTape, rtMeter]) r && r.dispose();
    rtField = [ccd(w, h), ccd(w, h)];
    rtWeave = rt(w, h); rtOptics = rt(w, h); rtTape = rt(w, h);
    rtChroma = rt(Math.max(8, Math.round(w / CDIV)), h);
    rtMeter = rt(MW, MH);
    meterBuf = new Uint8Array(MW * MH * 4);
    const v = new THREE.Vector2(w, h);
    weaveMat.uniforms.res.value = v;
    opticsMat.uniforms.res.value = v;
    chromaMat.uniforms.res.value = v;
    chromaMat.uniforms.cres.value = new THREE.Vector2(rtChroma.width, h);
    tapeMat.uniforms.res.value = v;
    dispMat.uniforms.res.value = v;
  }

  return {
    get __rts() {
      return {
        fieldA: rtField[0], fieldB: rtField[1], weave: rtWeave,
        optics: rtOptics, chroma: rtChroma, tape: rtTape,
      };
    },
    get __sig() { return M; },

    init() { alloc(cfg.sceneW, cfg.sceneH); },
    resize(w, h) { alloc(w, h); },

    renderField(scene, camera, field) {
      R.setRenderTarget(rtField[field]);
      R.clear(true, true, false);
      R.render(scene, camera);
      R.setRenderTarget(null);
    },

    present() {
      const q = (VB.quality == null ? 1 : VB.quality);

      weaveMat.uniforms.tA.value = rtField[0].texture;
      weaveMat.uniforms.tB.value = rtField[1].texture;
      blit(weaveMat, rtWeave);

      /* The meter costs a GPU->CPU readback, so it runs at a fraction of the
         frame rate. That is not a compromise: a real AE circuit is slow, and
         the extra latency feeds straight into the hunting. */
      const every = q < 0.5 ? 6 : 2;
      if (M.frameN % every === 0 || M.meterAge > 90) meter();
      M.meterAge++;

      sig(Math.min(0.1, (S.dt || 1 / 59.94) * 2));

      blit(opticsMat, rtOptics);
      blit(chromaMat, rtChroma);
      blit(tapeMat, rtTape);
      blit(dispMat, null);
    },

    repaint() {
      dispMat.uniforms.tD.value = rtTape.texture;
      blit(dispMat, null);
    },
  };
}, 70);


/* ==== 65_hud.js ========================================================= */
/* ============================================================================
   HUD — the camcorder's burned-in on-screen display.

   This is not a game UI. It is characters generated by the camera's character
   generator and recorded onto the tape as part of the picture, which is why
   postfx composites it *inside* the tape stage: the OSD gets the same chroma
   smear, the same tracking tear and the same noise as everything else. Anything
   here that looks crisp is wrong.

   Consumer camcorder OSD conventions being followed:
   * white characters with a hard black drop-shadow one pixel down-right, which
     is how they stayed legible over any scene
   * REC with a dot that blinks about once a second
   * a battery gauge that never quite tells you anything
   * the date/time burn-in bottom-right, in the AUG 17 1987 / 10:42:13 PM form
   * everything nailed to the safe-area inset, not the frame edge
   ========================================================================== */
VB.def('hud', function (VB, THREE) {
  const S = VB.S;
  let c, g, tx;
  let blink = 0, dot = true;
  let trackingUntil = -1, lastBurst = 0;

  /* The tape's own clock. Starts at a plausible "already been recording a
     while" offset so the counter never reads as a session that began when the
     player pressed play. */
  const T0 = 42 * 60 + 17;
  const START = { mo: 7, d: 17, h: 22, mi: 42, s: 13 };   // AUG 17 1987, 10:42 PM
  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const p2 = n => (n < 10 ? '0' : '') + n;

  /* A blocky character look. The condensed transform is doing real work: it is
     what separates a camcorder character generator from a web font. */
  function osd(text, x, y, size, align) {
    g.save();
    g.font = 'bold ' + size + 'px "Courier New",Courier,monospace';
    g.textAlign = align || 'left';
    g.textBaseline = 'alphabetic';
    g.translate(x, y);
    g.scale(0.86, 1.12);                 // tall and narrow, like the real thing
    g.fillStyle = 'rgba(0,0,0,0.85)';    // the drop shadow that keeps it legible
    g.fillText(text, 2, 2);
    g.fillStyle = '#fdfdf6';
    g.fillText(text, 0, 0);
    g.restore();
  }

  return {
    init() {
      c = document.createElement('canvas');
      c.width = 640; c.height = 480;
      g = c.getContext('2d');
      tx = new THREE.CanvasTexture(c);
      tx.minFilter = THREE.LinearFilter;
      tx.magFilter = THREE.LinearFilter;
      tx.generateMipmaps = false;
      /* Leave flipY at its default. postfx samples tHud with the frame's own
         uv, where v=1 is the top of the picture; CanvasTexture's default flip
         already maps the canvas's top row there. Forcing flipY=false inverts
         the whole OSD. */
      VB.hud = { texture: tx, w: c.width, h: c.height };
      VB.on('glitch:burst', () => {
        /* the character generator loses sync when the signal does */
        if (Math.random() < 0.55) trackingUntil = S.t + 0.8 + Math.random() * 1.6;
      });
    },

    lateUpdate(dt) {
      g.clearRect(0, 0, c.width, c.height);

      blink += dt;
      if (blink > 0.5) { blink = 0; dot = !dot; }

      const IX = 46, IY = 40;            // safe-area inset

      /* ---- REC, top left ---- */
      if (dot) {
        g.fillStyle = 'rgba(0,0,0,0.85)';
        g.beginPath(); g.arc(IX + 2, IY - 7, 9, 0, 7); g.fill();
        g.fillStyle = '#fdfdf6';
        g.beginPath(); g.arc(IX, IY - 9, 9, 0, 7); g.fill();
      }
      osd('REC', IX + 20, IY, 25);

      /* ---- tape counter, top right ---- */
      const tt = T0 + S.t;
      osd(p2(Math.floor(tt / 3600)) + ':' + p2(Math.floor(tt / 60) % 60) + ':' + p2(Math.floor(tt) % 60),
        c.width - IX, IY, 25, 'right');

      /* ---- battery, under the counter. Drains over the run. ---- */
      const bx = c.width - IX - 62, by = IY + 20;
      const bat = VB.clamp(1 - S.t / 4200, 0.06, 1);
      g.fillStyle = 'rgba(0,0,0,0.85)'; g.fillRect(bx + 2, by + 2, 56, 20);
      g.strokeStyle = '#fdfdf6'; g.lineWidth = 2.5;
      g.strokeRect(bx, by, 54, 18);
      g.fillStyle = '#fdfdf6'; g.fillRect(bx + 54, by + 5, 5, 8);
      /* the last bar flashes, because it always did */
      if (bat > 0.18 || dot) g.fillRect(bx + 4, by + 4, Math.max(3, 46 * bat), 10);

      /* ---- date/time burn-in, bottom right ---- */
      let sec = START.s + S.t, mi = START.mi + Math.floor(sec / 60), h = START.h;
      sec = Math.floor(sec % 60);
      h += Math.floor(mi / 60); mi = mi % 60;
      let d = START.d + Math.floor(h / 24); h = h % 24;
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      osd(MONTHS[START.mo] + ' ' + p2(d) + ' 1987', c.width - IX, c.height - IY - 30, 24, 'right');
      osd(p2(h12) + ':' + p2(mi) + ':' + p2(sec) + ' ' + ampm, c.width - IX, c.height - IY, 24, 'right');

      /* ---- TRACKING, bottom left, only while the signal is unstable ---- */
      if (S.t < trackingUntil || S.burst > 0.25) {
        osd('TRACKING', IX, c.height - IY, 24);
      }

      /* ---- SP tape speed, a detail that is only ever right or absent ---- */
      osd('SP', IX, IY + 34, 22);

      tx.needsUpdate = true;
    },
  };
}, 60);


/* ==== 80_perf.js ======================================================== */
/* ============================================================================
   PERF — keep the tape running at 29.97 on hardware that cannot afford it.

   The pipeline is expensive by design: two scene renders per presented frame
   (that is what makes motion comb) plus six fullscreen passes. A desktop GPU
   does not notice. A phone very much does.

   The order things are given up in matters, because some of them are the
   authenticity and some are only resolution:
     1. internal resolution — cheapest to lose. 640x480 is already far above
        what VHS resolves, so dropping toward 320x240 costs almost nothing
        visually; the tape chain is scaled in buffer-relative units so every
        artifact keeps its physical size.
     2. field rendering — LAST resort. Rendering one scene pass per presented
        frame halves the cost, but the two woven fields then come from the same
        instant and the combing disappears. That is the single most valuable
        cue in the whole piece, so it only goes when nothing else is left.
   ========================================================================== */
VB.def('perf', function (VB, THREE) {
  const S = VB.S, cfg = VB.cfg;

  /* 4:3 rungs. Heights stay even so the two field parities survive. */
  const RUNGS = [[640, 480], [512, 384], [416, 312], [320, 240], [256, 192]];
  let rung = 0;

  const HIST = 45;
  const dt = new Float32Array(HIST);
  let n = 0, filled = false, last = 0;
  let cooldown = 2.5;                 // settle before judging anything
  let sinceChange = 0;

  /* A coarse "this is a phone" signal. Used only to pick a starting rung —
     the measured frame time is what actually drives adaptation. */
  function isHandheld() {
    if (typeof navigator === 'undefined') return false;
    if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
    return /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent || '')
      || (navigator.maxTouchPoints > 1 && window.innerWidth < 1100);
  }

  function apply(next) {
    next = VB.clamp(next, 0, RUNGS.length - 1);
    if (next === rung) return;
    rung = next;
    const [w, h] = RUNGS[rung];
    cfg.sceneW = w; cfg.sceneH = h;
    VB.renderer.setSize(w, h, false);
    const px = VB.mods.postfx;
    if (px && px.resize) px.resize(w, h);
    VB.quality = 1 - rung / (RUNGS.length - 1);
    sinceChange = 0;
    console.log('[perf] internal resolution -> ' + w + 'x' + h);
  }

  function median() {
    const a = Array.prototype.slice.call(dt, 0, filled ? HIST : n).sort((x, y) => x - y);
    return a.length ? a[a.length >> 1] : 0;
  }

  return {
    init() {
      VB.quality = 1;
      VB.perf = {
        get rung() { return rung; },
        get medianMs() { return median(); },
        setRung: apply,
        rungs: RUNGS.length,
      };
      /* Phones start two rungs down rather than discovering it the hard way
         through several seconds of stutter. */
      if (isHandheld()) apply(2);
    },

    update(step) {
      /* Wall-clock, not the fixed sim step — we are measuring the machine. */
      const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      if (last) {
        dt[n++ % HIST] = now - last;
        if (n >= HIST) filled = true;
      }
      last = now;

      cooldown -= step; sinceChange += step;
      if (cooldown > 0 || (!filled && n < HIST) || sinceChange < 1.8) return;

      const m = median();
      /* Two fields are presented per frame, so a 29.97fps frame is ~16.7ms of
         field time. Give real headroom before reacting either way — thrashing
         the render targets is worse than being one rung too low. */
      if (m > 21 && rung < RUNGS.length - 1) apply(rung + 1);
      else if (m < 11 && rung > 0) apply(rung - 1);
    },
  };
}, 90);


/* ==== 99_boot.js ======================================================== */
/* ============================================================================
   BOOT — renderer, module instantiation, the director, and the 59.94Hz field
   clock. Presents at 29.97fps by weaving two temporally-distinct fields.
   ========================================================================== */
(function boot() {
  const S = VB.S, cfg = VB.cfg;

  /* ------------------------------------------------------------ renderer */
  const canvas = document.getElementById('screen');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: false, alpha: false, powerPreference: 'high-performance',
    stencil: false, depth: true,
  });
  renderer.setPixelRatio(1);
  renderer.setSize(cfg.sceneW, cfg.sceneH, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 1);
  VB.renderer = renderer;
  VB.canvas = canvas;

  const scene = new THREE.Scene();
  VB.scene = scene;
  const camera = new THREE.PerspectiveCamera(cfg.fov, cfg.aspect, 0.02, 60);
  VB.camera = camera;
  S.pos = new THREE.Vector3(0, cfg.eyeHeight, 0);

  /* ------------------------------------------------- module instantiation */
  VB._factories.sort((a, b) => a.order - b.order);
  for (const f of VB._factories) {
    try {
      VB.mods[f.name] = f.factory(VB, THREE) || {};
    } catch (e) {
      console.error('[module ' + f.name + ' construct]', e);
      VB.mods[f.name] = {};
    }
  }
  const list = VB._factories.map(f => VB.mods[f.name]);
  const call = (fn, ...a) => {
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      if (m && typeof m[fn] === 'function') {
        try { m[fn](...a); } catch (e) { console.error('[' + VB._factories[i].name + '.' + fn + ']', e); }
      }
    }
  };
  call('init');

  /* -------------------------------------------------------------- layout */
  function layoutScreen() {
    const W = window.innerWidth, H = window.innerHeight;
    /* Pillarbox / letterbox to a hard 4:3 window. */
    let w = W, h = W / cfg.aspect;
    if (h > H) { h = H; w = H * cfg.aspect; }
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
    canvas.style.left = Math.round((W - w) / 2) + 'px';
    canvas.style.top = Math.round((H - h) / 2) + 'px';
    call('resize', cfg.sceneW, cfg.sceneH);
  }
  window.addEventListener('resize', layoutScreen);
  layoutScreen();

  /* ------------------------------------------------------------ director */
  /* Owns S.dread / S.wear / S.burst / S.dropout — the slow build of the tape
     falling apart and the room getting less friendly. */
  let nextBurst = 6 + Math.random() * 14;
  let nextDrop = 3 + Math.random() * 9;
  const director = {
    update(dt) {
      /* Tape wear: monotonic, asymptotic. Reaches ~0.5 at 6 min, ~0.8 at 20. */
      S.wear = 1 - Math.exp(-S.t / 520) * (1 - 0.02);
      S.wear = VB.clamp(S.wear + S.prox * 0.10, 0, 1);

      /* Dread: slow base ramp, pushed hard by entity proximity/sighting. */
      const base = VB.smoothstep(0, 300, S.t) * 0.55;
      const target = VB.clamp(base + S.prox * 0.55 + S.seen * 0.35 + S.stalked * 0.25, 0, 1);
      S.dread = VB.approach(S.dread, target, target > S.dread ? 1.6 : 0.22, dt);

      /* Static bursts — more frequent as the tape wears and dread climbs. */
      nextBurst -= dt * (0.55 + S.wear * 1.9 + S.dread * 1.3);
      if (nextBurst <= 0) {
        nextBurst = 5 + Math.random() * 16;
        VB.emit('glitch:burst', { amt: 0.35 + Math.random() * 0.65 * (0.4 + S.wear) });
      }
      S.burst = Math.max(0, S.burst - dt * 3.4);

      /* Dropouts — the short white/black streaks of shed oxide. */
      nextDrop -= dt * (0.7 + S.wear * 3.2);
      if (nextDrop <= 0) { nextDrop = 1.6 + Math.random() * 7; S.dropout = 0.4 + Math.random() * 0.6; }
      S.dropout = Math.max(0, S.dropout - dt * 5.5);

      S.roomPulse = Math.max(0, S.roomPulse - dt * 1.25);
    },
  };
  VB.on('glitch:burst', e => { S.burst = Math.max(S.burst, e && e.amt != null ? e.amt : 0.6); });
  VB.on('room:enter', () => { S.roomPulse = Math.min(1, S.roomPulse + 0.75); });

  /* ----------------------------------------------------------- the clock */
  const FIELD_DT = 1 / 59.94;
  const MAX_STEPS = 3;
  let acc = 0, last = performance.now() / 1000;
  let field = 0;                 // 0 = upper field, 1 = lower field
  VB.field = 0;
  VB.running = false;
  VB.deterministic = false;      // harness sets true for reproducible frames

  function stepSim(dt) {
    S.dt = dt; S.t += dt; S.frame++;
    director.update(dt);
    call('update', dt);
    call('lateUpdate', dt);
  }

  /* Renders the scene into postfx's CCD buffer for the current field, then —
     on the lower field — weaves + presents the finished frame. */
  function renderField() {
    VB.field = field;
    const px = VB.mods.postfx;
    if (px && px.renderField) px.renderField(scene, camera, field);
    else renderer.render(scene, camera);
    if (field === 1 && px && px.present) px.present();
    field ^= 1;
  }

  function frame(nowMs) {
    if (!VB.deterministic) {
      const now = nowMs / 1000;
      let wall = now - last; last = now;
      if (wall > 0.25) wall = 0.25;
      acc += wall;
      let steps = 0;
      while (acc >= FIELD_DT && steps < MAX_STEPS) {
        acc -= FIELD_DT; steps++;
        if (VB.running) stepSim(FIELD_DT);
        renderField();
      }
      if (steps === 0 && VB.mods.postfx && VB.mods.postfx.repaint) VB.mods.postfx.repaint();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ------------------------------------------------------------ start-up */
  /* Audio + pointer lock both require a gesture. The "press play" plate is
     itself diegetic: a paused VCR. */
  function start() {
    if (VB.running) return;
    VB.running = true;
    call('start');
    VB.emit('game:start');
  }
  VB.start = start;

  /* -------------------------------------------------------- harness hook */
  window.__VB = {
    VB, S, cfg,
    ready: true,
    /* Advance exactly n fields of fixed dt with the wall clock ignored, so a
       screenshot at step N is bit-identical run to run (given a fixed seed). */
    step(n = 1) {
      VB.deterministic = true;
      if (!VB.running) { VB.running = true; call('start'); VB.emit('game:start'); }
      for (let i = 0; i < n; i++) { stepSim(FIELD_DT); renderField(); }
    },
    /* Jump the clock without rendering — lets a critic see minute-20 tape wear
       without waiting for 70000 software-rasterised fields. */
    warp(seconds) {
      S.t += seconds;
      director.update(1 / 60);
      for (let i = 0; i < 30; i++) director.update(0.2);
    },
    seed(v) { S.seed = v >>> 0; VB.emit('world:reseed', v >>> 0); },
    set(k, v) { S[k] = v; },
    teleport(x, z, yaw) {
      S.pos.set(x, cfg.eyeHeight, z);
      if (yaw != null) S.yaw = yaw;
      VB.emit('player:teleport');
    },
    modules() { return VB._factories.map(f => f.name); },
  };
  window.VB = VB;
  console.log('[vb] booted modules:', VB._factories.map(f => f.name).join(', '));
})();

</script>
</body>
</html>
